<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Angotell</title>

<style>
:root{
    --bg:#090811;
    --panel:#11101a;
    --panel2:#171522;
    --panel3:#1d1928;
    --text:#f7f3ff;
    --muted:#9e98aa;
    --border:rgba(255,255,255,.08);
    --pink:#e84d9b;
    --purple:#8c4de8;
    --orange:#ff7043;
    --cyan:#25c8ee;
    --green:#40dc9a;
    --danger:#ff5474;
    --shadow:0 15px 50px rgba(0,0,0,.38);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,input,textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   APP
========================= */

#app{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 15% 5%,rgba(140,77,232,.12),transparent 28%),
        radial-gradient(circle at 90% 80%,rgba(232,77,155,.10),transparent 30%),
        var(--bg);
}

/* =========================
   AUTH
========================= */

.auth-screen{
    width:100%;
    height:100%;
    overflow-y:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
        max(20px,env(safe-area-inset-top))
        16px
        max(20px,env(safe-area-inset-bottom));
}

.auth-card{
    width:min(100%,610px);
    background:rgba(17,16,26,.92);
    border:1px solid var(--border);
    border-radius:34px;
    padding:30px 24px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(25px);
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:94px;
    height:94px;
    margin:auto;
    border-radius:29px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    font-weight:900;
    color:white;
    background:
        linear-gradient(
            135deg,
            #ff654c,
            #ec3e91 35%,
            #8d4fe9 65%,
            #18c8ed
        );
    box-shadow:
        0 0 35px rgba(232,77,155,.25);
}

.brand h1{
    margin:18px 0 8px;
    font-size:40px;
    letter-spacing:-1.5px;
    background:linear-gradient(90deg,#c85bea,#ff6c55,#ff9d4a);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.brand p{
    color:var(--muted);
    line-height:1.6;
    margin:0 auto;
    max-width:420px;
}

.auth-tabs{
    display:flex;
    padding:5px;
    background:#171520;
    border-radius:18px;
    margin:24px 0;
}

.auth-tabs button{
    flex:1;
    padding:14px;
    color:var(--muted);
    background:transparent;
    border-radius:14px;
    font-weight:700;
}

.auth-tabs button.active{
    color:white;
    background:
        linear-gradient(
            110deg,
            rgba(140,77,232,.55),
            rgba(232,77,155,.38)
        );
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin:0 0 8px 5px;
    color:#bdb7c7;
    font-size:14px;
    font-weight:700;
}

.field input{
    width:100%;
    border:1px solid var(--border);
    outline:0;
    color:white;
    background:#181721;
    border-radius:18px;
    padding:16px;
    transition:.2s;
}

.field input:focus{
    border-color:rgba(232,77,155,.55);
    box-shadow:0 0 0 3px rgba(232,77,155,.08);
}

.primary-btn{
    width:100%;
    padding:17px;
    border-radius:19px;
    color:white;
    font-weight:800;
    background:
        linear-gradient(
            110deg,
            #9a4de8,
            #e63f9c,
            #ff7045
        );
    box-shadow:0 12px 30px rgba(180,55,160,.22);
}

.primary-btn:disabled{
    opacity:.6;
}

.status{
    min-height:20px;
    text-align:center;
    margin-top:13px;
    font-size:13px;
}

.status.error{
    color:#ff6582;
}

.status.success{
    color:var(--green);
}

/* =========================
   MAIN APP
========================= */

.main-app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
}

.topbar{
    min-height:66px;
    padding:
        max(8px,env(safe-area-inset-top))
        14px
        8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(9,8,17,.88);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(22px);
    z-index:10;
}

.top-left{
    display:flex;
    align-items:center;
    gap:11px;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    color:white;
    background:
        linear-gradient(
            135deg,
            #8d4ee8,
            #eb439a,
            #ff7547
        );
    position:relative;
    flex:none;
}

.online-dot{
    position:absolute;
    right:-1px;
    bottom:1px;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--green);
    border:2px solid var(--bg);
}

.top-title{
    min-width:0;
}

.top-title strong{
    display:block;
    font-size:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.top-title small{
    color:var(--muted);
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:43px;
    height:43px;
    border-radius:15px;
    background:#171520;
    color:#e9e4f0;
    border:1px solid var(--border);
}

/* =========================
   FLOATING SEARCH
========================= */

.search-area{
    position:absolute;
    top:74px;
    left:12px;
    right:12px;
    z-index:30;
    pointer-events:none;
}

.search-box{
    pointer-events:auto;
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(24,23,34,.97);
    border:1px solid var(--border);
    border-radius:20px;
    padding:4px 7px 4px 15px;
    box-shadow:var(--shadow);
}

.search-box input{
    min-width:0;
    flex:1;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    padding:12px 0;
}

.search-results{
    margin-top:7px;
    max-height:55vh;
    overflow:auto;
    background:rgba(17,16,26,.98);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
}

.search-result{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-bottom:1px solid var(--border);
}

.search-result:last-child{
    border-bottom:0;
}

.result-info{
    flex:1;
    min-width:0;
}

.result-info strong,
.result-info small{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.result-info small{
    color:var(--muted);
    margin-top:3px;
}

.result-actions{
    display:flex;
    gap:5px;
}

.small-btn{
    padding:9px 11px;
    border-radius:12px;
    background:#252032;
    color:white;
    font-size:12px;
    font-weight:700;
}

.small-btn.primary{
    background:linear-gradient(110deg,#814ce7,#e4499b);
}

/* =========================
   CONTENT
========================= */

.content{
    flex:1;
    min-height:0;
    overflow:hidden;
    position:relative;
}

.page{
    width:100%;
    height:100%;
    overflow-y:auto;
    padding:
        18px
        14px
        calc(95px + env(safe-area-inset-bottom));
}

.section-title{
    margin:5px 3px 13px;
    color:#c4bdcc;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.7px;
}

/* =========================
   CHAT LIST
========================= */

.chat-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.chat-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 10px;
    border-radius:18px;
    background:rgba(24,23,34,.72);
    border:1px solid transparent;
}

.chat-item:active{
    background:#211e2c;
}

.chat-info{
    flex:1;
    min-width:0;
}

.chat-line{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.chat-name{
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-time{
    color:var(--muted);
    font-size:11px;
    flex:none;
}

.chat-preview{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.unread{
    min-width:21px;
    height:21px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--pink);
    font-size:11px;
    font-weight:900;
}

/* =========================
   CONTACTS
========================= */

.contact-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    background:#15141e;
    border:1px solid var(--border);
    border-radius:18px;
    margin-bottom:8px;
}

.contact-info{
    flex:1;
    min-width:0;
}

.contact-info strong{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-info small{
    color:var(--muted);
}

/* =========================
   PROFILE
========================= */

.profile-card{
    background:#15141e;
    border:1px solid var(--border);
    border-radius:24px;
    padding:22px;
}

.profile-big-avatar{
    width:85px;
    height:85px;
    margin:0 auto 15px;
    border-radius:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
    background:linear-gradient(135deg,#874be7,#e6499b,#ff7044);
}

.profile-name{
    text-align:center;
    font-size:22px;
    font-weight:900;
}

.profile-username{
    text-align:center;
    color:var(--muted);
    margin:5px 0 20px;
}

/* =========================
   BOTTOM FLOATING BAR
========================= */

.bottom-bar{
    position:absolute;
    left:12px;
    right:12px;
    bottom:max(12px,env(safe-area-inset-bottom));
    height:65px;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-around;
    border-radius:23px;
    background:rgba(23,21,32,.94);
    border:1px solid var(--border);
    box-shadow:0 15px 40px rgba(0,0,0,.38);
    backdrop-filter:blur(25px);
}

.nav-btn{
    width:25%;
    height:100%;
    background:transparent;
    color:#8f899a;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.nav-btn span:first-child{
    font-size:20px;
}

.nav-btn.active{
    color:#fff;
}

/* =========================
   CONVERSATION
========================= */

.conversation{
    position:absolute;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at 80% 10%,rgba(140,77,232,.10),transparent 25%),
        var(--bg);
}

.conversation-head{
    min-height:68px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:
        max(8px,env(safe-area-inset-top))
        10px
        8px;
    border-bottom:1px solid var(--border);
    background:rgba(9,8,17,.91);
    backdrop-filter:blur(20px);
}

.back-btn{
    width:42px;
    height:42px;
    border-radius:14px;
    color:white;
    background:#171520;
}

.conversation-user{
    flex:1;
    min-width:0;
}

.conversation-user strong,
.conversation-user small{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.conversation-user small{
    color:var(--muted);
    margin-top:2px;
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:15px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.message{
    max-width:82%;
    display:flex;
    flex-direction:column;
}

.message.mine{
    align-self:flex-end;
    align-items:flex-end;
}

.message.theirs{
    align-self:flex-start;
}

.bubble{
    padding:10px 13px;
    border-radius:18px;
    background:#1b1924;
    border:1px solid var(--border);
    line-height:1.45;
    word-break:break-word;
}

.mine .bubble{
    background:
        linear-gradient(
            135deg,
            rgba(132,73,230,.9),
            rgba(215,63,144,.9)
        );
    border-bottom-right-radius:5px;
}

.theirs .bubble{
    border-bottom-left-radius:5px;
}

.message-meta{
    display:flex;
    align-items:center;
    gap:5px;
    margin:3px 5px 0;
    color:#85808d;
    font-size:10px;
}

.read{
    color:#47cfff;
    font-weight:900;
}

.composer{
    padding:
        8px
        9px
        max(9px,env(safe-area-inset-bottom));
    display:flex;
    gap:7px;
    align-items:flex-end;
    background:rgba(9,8,17,.94);
    border-top:1px solid var(--border);
}

.composer textarea{
    flex:1;
    min-height:44px;
    max-height:120px;
    resize:none;
    border:1px solid var(--border);
    outline:0;
    border-radius:18px;
    padding:12px 14px;
    color:white;
    background:#171620;
}

.send-btn{
    width:46px;
    height:46px;
    border-radius:16px;
    color:white;
    background:linear-gradient(135deg,#874be7,#e94a99);
}

/* =========================
   MODALS
========================= */

.modal-layer{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(7px);
}

.modal{
    width:100%;
    max-height:90%;
    overflow:auto;
    padding:22px 17px max(22px,env(safe-area-inset-bottom));
    background:#12111b;
    border-top:1px solid var(--border);
    border-radius:28px 28px 0 0;
}

.modal h2{
    margin:0 0 18px;
}

.modal-actions{
    display:flex;
    gap:8px;
}

.modal-actions button{
    flex:1;
}

/* =========================
   LOADING
========================= */

#loading{
    position:absolute;
    inset:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#090811;
}

.loader{
    width:42px;
    height:42px;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:#e84d9b;
    border-right-color:#8c4de8;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
}

.toast{
    position:absolute;
    left:15px;
    right:15px;
    bottom:95px;
    z-index:500;
    padding:13px 16px;
    border-radius:16px;
    background:#252131;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    text-align:center;
    font-size:13px;
}

@media(min-width:700px){
    .page{
        padding-left:25px;
        padding-right:25px;
    }

    .bottom-bar{
        left:50%;
        right:auto;
        width:500px;
        transform:translateX(-50%);
    }

    .conversation{
        left:50%;
        width:min(100%,700px);
        transform:translateX(-50%);
        border-left:1px solid var(--border);
        border-right:1px solid var(--border);
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- LOADING -->
    <div id="loading">
        <div class="loader"></div>
    </div>

    <!-- AUTH -->
    <section id="authScreen" class="auth-screen hidden">
        <div class="auth-card">

            <div class="brand">
                <div class="logo">A</div>
                <h1>Angotell</h1>
                <p>
                    Comunicação de nova geração.
                    Cria a tua identidade e conecta-te com pessoas reais.
                </p>
            </div>

            <div class="auth-tabs">
                <button id="loginTab" class="active">Entrar</button>
                <button id="registerTab">Criar conta</button>
            </div>

            <form id="authForm">

                <div id="registerFields" class="hidden">

                    <div class="field">
                        <label>Nome público</label>
                        <input
                            id="displayName"
                            type="text"
                            autocomplete="name"
                            placeholder="Como as pessoas verão o teu nome">
                    </div>

                    <div class="field">
                        <label>Nome de utilizador</label>
                        <input
                            id="username"
                            type="text"
                            autocomplete="username"
                            placeholder="@teu_nome">
                    </div>

                </div>

                <div class="field">
                    <label>E-mail</label>
                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        required
                        placeholder="teu@email.com">
                </div>

                <div class="field">
                    <label>Senha</label>
                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        placeholder="••••••••">
                </div>

                <button id="authButton" class="primary-btn" type="submit">
                    Entrar no Angotell
                </button>

                <div id="authStatus" class="status"></div>

            </form>
        </div>
    </section>

    <!-- MAIN -->
    <section id="mainApp" class="main-app hidden">

        <header class="topbar">

            <div class="top-left">

                <div id="topAvatar" class="avatar">
                    A
                    <span id="topOnline" class="online-dot"></span>
                </div>

                <div class="top-title">
                    <strong id="topName">Angotell</strong>
                    <small id="topUsername">@utilizador</small>
                </div>

            </div>

            <div class="top-actions">
                <button id="searchToggle" class="icon-btn">⌕</button>
                <button id="profileButton" class="icon-btn">◉</button>
            </div>

        </header>

        <!-- FLOATING SEARCH -->
        <div id="searchArea" class="search-area hidden">

            <div class="search-box">
                <span>⌕</span>
                <input
                    id="globalSearch"
                    type="search"
                    autocomplete="off"
                    placeholder="Pesquisar pessoas...">
                <button id="closeSearch" class="icon-btn">×</button>
            </div>

            <div id="searchResults" class="search-results hidden"></div>

        </div>

        <main class="content">

            <!-- CHATS -->
            <section id="chatsPage" class="page">

                <div class="section-title">
                    Conversas
                </div>

                <div id="chatList" class="chat-list"></div>

            </section>

            <!-- CONTACTS -->
            <section id="contactsPage" class="page hidden">

                <div class="section-title">
                    Os meus contactos
                </div>

                <div id="contactsList"></div>

            </section>

            <!-- PROFILE -->
            <section id="profilePage" class="page hidden">

                <div class="profile-card">

                    <div id="profileAvatar" class="profile-big-avatar">
                        A
                    </div>

                    <div id="profileDisplayName" class="profile-name">
                        Utilizador
                    </div>

                    <div id="profileUsername" class="profile-username">
                        @utilizador
                    </div>

                    <div class="field">
                        <label>Nome público</label>
                        <input id="editDisplayName" type="text">
                    </div>

                    <div class="field">
                        <label>Nome de utilizador</label>
                        <input id="editUsername" type="text">
                    </div>

                    <button id="saveProfile" class="primary-btn">
                        Guardar perfil
                    </button>

                    <br><br>

                    <button id="logoutButton"
                            class="primary-btn"
                            style="background:#2a1720">
                        Terminar sessão
                    </button>

                    <div id="profileStatus" class="status"></div>

                </div>

            </section>

        </main>

        <!-- FLOATING NAV -->
        <nav class="bottom-bar">

            <button class="nav-btn active" data-page="chatsPage">
                <span>◉</span>
                <span>Conversas</span>
            </button>

            <button class="nav-btn" data-page="contactsPage">
                <span>♧</span>
                <span>Contactos</span>
            </button>

            <button id="createGroupButton" class="nav-btn">
                <span>＋</span>
                <span>Grupo</span>
            </button>

            <button class="nav-btn" data-page="profilePage">
                <span>◎</span>
                <span>Perfil</span>
            </button>

        </nav>

    </section>

    <!-- CONVERSATION -->
    <section id="conversation" class="conversation hidden">

        <header class="conversation-head">

            <button id="backConversation" class="back-btn">
                ‹
            </button>

            <div id="conversationAvatar" class="avatar">
                A
            </div>

            <div class="conversation-user">
                <strong id="conversationName">Conversa</strong>
                <small id="conversationStatus">offline</small>
            </div>

        </header>

        <div id="messages" class="messages"></div>

/* =========================================================
   UTILITÁRIOS
========================================================= */

function escapeHTML(value = ""){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function normalizeUsername(value = ""){
    return value
        .trim()
        .toLowerCase()
        .replace(/^@/,"")
        .replace(/\s+/g,"")
        .replace(/[^a-z0-9_.-]/g,"");
}

function initials(name = "A"){
    const parts = name.trim().split(/\s+/).filter(Boolean);

    if(!parts.length) return "A";

    if(parts.length === 1){
        return parts[0].substring(0,2).toUpperCase();
    }

    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();
}

function showToast(text){
    toast.textContent = text;
    toast.classList.remove("hidden");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.classList.add("hidden");
    },2600);
}

function setAuthStatus(text,type=""){
    authStatus.textContent = text;
    authStatus.className = "status " + type;
}

function formatTime(timestamp){

    if(!timestamp) return "";

    const date = timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleTimeString(
        "pt-AO",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function formatDate(timestamp){

    if(!timestamp) return "";

    const date = timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleDateString(
        "pt-AO",
        {
            day:"2-digit",
            month:"2-digit"
        }
    );
}

});


/* =========================================================
   AUTH
========================================================= */

authForm.addEventListener("submit",async event => {

    event.preventDefault();

    authButton.disabled = true;
    setAuthStatus("A processar...");

    try{

        if(authMode === "register"){

            const publicName =
                displayNameInput.value.trim();

            const username =
                normalizeUsername(usernameInput.value);

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            if(!publicName || !username){
                throw new Error(
                    "Preenche o nome público e o nome de utilizador."
                );
            }

            if(username.length < 3){
                throw new Error(
                    "O nome de utilizador deve ter pelo menos 3 caracteres."
                );
            }

            /*
             * IMPORTANTE:
             * Authentication é concluída primeiro.
             * Não esperamos Firestore para abrir o app.
             */

            const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            currentUser = credential.user;

            /*
             * O perfil é iniciado em segundo plano.
             * Não bloqueia a entrada.
             */

            createProfileInBackground(
                credential.user,
                publicName,
                username
            );

            setAuthStatus(
                "Conta criada. A entrar...",
                "success"
            );

            /*
             * onAuthStateChanged abrirá o app.
             */

        }else{

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

    }catch(error){

        console.error(error);

        setAuthStatus(
            firebaseError(error),
            "error"
        );

        authButton.disabled = false;
    }
});


function firebaseError(error){

    const code = error?.code || "";

    const errors = {
        "auth/email-already-in-use":
            "Este e-mail já está registado.",

        "auth/invalid-email":
            "O e-mail não é válido.",

        "auth/weak-password":
            "A senha é demasiado fraca.",

        "auth/invalid-credential":
            "E-mail ou senha incorretos.",

        "auth/user-not-found":
            "Utilizador não encontrado.",

        "auth/wrong-password":
            "Senha incorreta.",

        "auth/network-request-failed":
            "Problema de ligação à internet."
    };

    return errors[code] ||
        error?.message ||
        "Ocorreu um erro.";
}


/* =========================================================
   PROFILE
========================================================= */

async function createProfileInBackground(
    user,
    publicName,
    username
){

    try{

        const profileRef =
            doc(db,"users",user.uid);

        await setDoc(
            profileRef,
            {
                uid:user.uid,
                displayName:publicName,
                username,
                usernameLower:username,
                email:user.email || "",
                online:true,
                lastSeen:serverTimestamp(),
                createdAt:serverTimestamp()
            },
            { merge:true }
        );

    }catch(error){

        console.error(
            "Erro ao criar perfil:",
            error
        );

    }
}


async function loadProfile(){

    if(!currentUser) return null;

    const ref =
        doc(db,"users",currentUser.uid);

    const snap =
        await getDoc(ref);

    if(!snap.exists()){

        /*
         * Conta Firebase pode existir mesmo que
         * a criação do perfil tenha demorado.
         */

        return null;
    }

    return {
        id:snap.id,
        ...snap.data()
    };
}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(auth,async user => {

    currentUser = user;

    if(!user){

        cleanupListeners();

        mainApp.classList.add("hidden");
        conversation.classList.add("hidden");
        authScreen.classList.remove("hidden");

        loading.classList.add("hidden");

        authButton.disabled = false;

        return;
    }

    /*
     * Entrada rápida.
     * Não há espera artificial.
     */

    authScreen.classList.add("hidden");
    mainApp.classList.remove("hidden");
    loading.classList.add("hidden");

    authButton.disabled = false;

    /*
     * Carrega o perfil sem bloquear a renderização.
     */

    loadUserAfterEntry();

});


async function loadUserAfterEntry(){

    try{

        currentProfile =
            await loadProfile();

        /*
         * Se o perfil ainda não terminou de ser criado,
         * tentamos novamente sem travar a aplicação.
         */

        if(!currentProfile){

            setTimeout(
                loadUserAfterEntry,
                1200
            );

            return;
        }

        renderProfile();
        startRealtimeData();
        updatePresence();

    }catch(error){

        console.error(error);

        /*
         * O app continua aberto mesmo se uma leitura
         * secundária falhar.
         */

        showToast(
            "Ligação ao perfil temporariamente indisponível."
        );
    }
}

async function updatePresence(){

                    ref,
                    {
                        online:true,
                        lastSeen:serverTimestamp()

                console.warn(error);

/* =========================================================
   REALTIME DATA
========================================================= */

function startRealtimeData(){

    /*
     * Não criamos listeners de mensagens de todas
     * as conversas.
     *
     * Mensagens só são escutadas quando a conversa
     * correspondente é aberta.
     */

    startChatListener();
    startContactListener();
}


/* =========================================================
   CHAT LIST
========================================================= */

function startChatListener(){

    if(unsubscribeChats)
        unsubscribeChats();

    const chatsRef =
        collection(db,"chats");

    const q =
        query(
            chatsRef,
            where(
                "members",
                "array-contains",
                currentUser.uid
            ),
            orderBy(
                "updatedAt",
                "desc"
            ),
            limit(40)
        );

    unsubscribeChats =
        onSnapshot(
            q,
            snapshot => {

                const chats =
                    snapshot.docs.map(
                        doc => ({
                            id:doc.id,
                            ...doc.data()
                        })
                    );

                renderChats(chats);

            },
            error => {

                console.error(
                    "Chat listener:",
                    error
                );

                /*
                 * Se a consulta composta exigir índice,
                 * o restante do app continua funcionando.
                 */

                chatList.innerHTML = `
                    <div class="empty">
                        As conversas aparecerão aqui.
                    </div>
                `;
            }
        );
}


async function renderChats(chats){

    if(!chats.length){

        chatList.innerHTML = `
            <div class="empty">
                Ainda não tens conversas.<br>
                Usa a pesquisa para encontrar pessoas.
            </div>
        `;

        return;
    }

    /*
     * Busca somente os perfis necessários.
     * Não faz uma pesquisa global inteira.
     */

    const uniqueIds =
        new Set();

    chats.forEach(chat => {

        (chat.members || []).forEach(uid => {

            if(uid !== currentUser.uid)
                uniqueIds.add(uid);

        });

    });

    const profiles =
        new Map();

    await Promise.all(
        [...uniqueIds].map(async uid => {

            try{

                const snap =
                    await getDoc(
                        doc(db,"users",uid)
                    );

                if(snap.exists())
                    profiles.set(
                        uid,
                        snap.data()
                    );

            }catch(error){}
        })
    );

    chatList.innerHTML = chats.map(chat => {

        const otherId =
            (chat.members || [])
                .find(
                    uid =>
                        uid !== currentUser.uid
                );

        const profile =
            otherId
                ? profiles.get(otherId)
                : null;

        const name =
            chat.type === "group"
                ? chat.name || "Grupo"
                : profile?.displayName ||
                  "Utilizador";

        const preview =
            chat.lastMessage ||
            "Nova conversa";

        return `
            <button
                class="chat-item"
                data-chat-id="${escapeHTML(chat.id)}"
                style="width:100%;text-align:left;color:inherit">

                <div class="avatar">
                    ${escapeHTML(initials(name))}
                    ${
                        chat.type !== "group" &&
                        profile?.online
                        ? `<span class="online-dot"></span>`
                        : ""
                    }
                </div>

                <div class="chat-info">

                    <div class="chat-line">
                        <span class="chat-name">
                            ${escapeHTML(name)}
                        </span>

                        <span class="chat-time">
                            ${formatTime(chat.updatedAt)}
                        </span>
                    </div>

                    <div class="chat-preview">
                        ${escapeHTML(preview)}
                    </div>

                </div>

            </button>
        `;

    }).join("");

    chatList
        .querySelectorAll("[data-chat-id]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => openConversation(
                    button.dataset.chatId
                )
            );

        });
}


/* =========================================================
   CONTACTS
========================================================= */

function startContactListener(){

    if(unsubscribeContacts)
        unsubscribeContacts();

    const ref =
        doc(
            db,
            "users",
            currentUser.uid
        );

    unsubscribeContacts =
        onSnapshot(
            ref,
            snapshot => {

                if(!snapshot.exists())
                    return;

                currentProfile = {
                    id:snapshot.id,
                    ...snapshot.data()
                };

                renderProfile();
                renderContacts();

            }
        );
}


async function renderContacts(){

    const ids =
        currentProfile?.contacts || [];

    if(!ids.length){

        contactsList.innerHTML = `
            <div class="empty">
                Ainda não tens contactos.<br>
                Pesquisa uma pessoa para adicionar.
            </div>
        `;

        return;
    }

    const profiles = [];

    await Promise.all(
        ids.map(async uid => {

            try{

                const snap =
                    await getDoc(
                        doc(db,"users",uid)
                    );

                if(snap.exists()){

                    profiles.push({
                        id:snap.id,
                        ...snap.data()
                    });

                }

            }catch(error){}
        })
    );

    contactsList.innerHTML =
        profiles.map(profile => {

            const name =
                profile.displayName ||
                "Utilizador";

            return `
                <div class="contact-item">

                    <div class="avatar">
                        ${escapeHTML(initials(name))}
                        ${
                            profile.online
                            ? `<span class="online-dot"></span>`
                            : ""
                        }
                    </div>

                    <div class="contact-info">
                        <strong>
                            ${escapeHTML(name)}
                        </strong>

                        <small>
                            @${escapeHTML(
                                profile.username || ""
                            )}
                        </small>
                    </div>

                    <button
                        class="small-btn primary start-contact-chat"
                        data-uid="${escapeHTML(profile.uid)}">
                        Conversar
                    </button>

                </div>
            `;

        }).join("");

    contactsList
        .querySelectorAll(".start-contact-chat")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => createOrOpenDirectChat(
                    button.dataset.uid
                )
            );

        });
}


/* =========================================================
   SEARCH
========================================================= */

$("searchToggle").addEventListener(
    "click",
    () => {

        searchArea.classList.remove("hidden");

        setTimeout(
            () => globalSearch.focus(),
            30
        );
    }
);


$("closeSearch").addEventListener(
    "click",
    closeSearch
);


function closeSearch(){

    searchArea.classList.add("hidden");

    globalSearch.value = "";

    searchResults.innerHTML = "";
    searchResults.classList.add("hidden");
}


globalSearch.addEventListener(
    "input",
    () => {

        clearTimeout(searchTimer);

        const term =
            normalizeUsername(
                globalSearch.value
            );

        if(term.length < 2){

            searchResults.innerHTML = "";
            searchResults.classList.add("hidden");

            return;
        }

        /*
         * Debounce:
         * evita uma consulta ao Firebase
         * a cada tecla digitada.
         */

        searchTimer =
            setTimeout(
                () => searchUsers(term),
                280
            );
    }
);


async function searchUsers(term){

    searchResults.classList.remove("hidden");

    searchResults.innerHTML = `
        <div class="empty">
            A pesquisar...
        </div>
    `;

    try{

        const usersRef =
            collection(db,"users");

        const q =
            query(
                usersRef,
                where(
                    "usernameLower",
                    ">=",
                    term
                ),
                where(
                    "usernameLower",
                    "<=",
                    term + "\uf8ff"
                ),
                limit(20)
            );

        const snapshot =
            await getDocs(q);

        const results =
            snapshot.docs
                .map(
                    doc => ({
                        id:doc.id,
                        ...doc.data()
                    })
                )
                .filter(
                    user =>
                        user.uid !== currentUser.uid
                );

        if(!results.length){

            searchResults.innerHTML = `
                <div class="empty">
                    Nenhum utilizador encontrado.
                </div>
            `;

            return;
        }

        searchResults.innerHTML =
            results.map(user => {

                const name =
                    user.displayName ||
                    "Utilizador";

                const isContact =
                    (
                        currentProfile?.contacts ||
                        []
                    ).includes(user.uid);

                return `
                    <div class="search-result">

                        <div class="avatar">
                            ${escapeHTML(
                                initials(name)
                            )}

                            ${
                                user.online
                                ? `<span class="online-dot"></span>`
                                : ""
                            }
                        </div>

                        <div class="result-info">

                            <strong>
                                ${escapeHTML(name)}
                            </strong>

                            <small>
                                @${escapeHTML(
                                    user.username || ""
                                )}
                            </small>

                        </div>

                        <div class="result-actions">

                            <button
                                class="small-btn ${
                                    isContact
                                    ? ""
                                    : "primary"
                                } add-contact"
                                data-uid="${escapeHTML(user.uid)}">

                                ${
                                    isContact
                                    ? "Contacto"
                                    : "Adicionar"
                                }

                            </button>

                            <button
                                class="small-btn start-search-chat"
                                data-uid="${escapeHTML(user.uid)}">
                                Chat
                            </button>

                        </div>

                    </div>
                `;

            }).join("");

        searchResults
            .querySelectorAll(".add-contact")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => addContact(
                        button.dataset.uid
                    )
                );

            });

        searchResults
            .querySelectorAll(".start-search-chat")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => createOrOpenDirectChat(
                        button.dataset.uid
                    )
                );

            });

    }catch(error){

        console.error(error);

        searchResults.innerHTML = `
            <div class="empty">
                Não foi possível realizar a pesquisa.
            </div>
        `;
    }
}


/* =========================================================
   ADD CONTACT
========================================================= */

async function addContact(uid){

    if(!currentUser || !uid) return;

    if(
        (currentProfile.contacts || [])
            .includes(uid)
    ){

        showToast(
            "Este utilizador já está nos teus contactos."
        );

        return;
    }

    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                contacts:arrayUnion(uid)
            }
        );

        /*
         * A lista será atualizada pelo listener.
         */

        showToast(
            "Contacto adicionado."
        );

        searchUsers(
            normalizeUsername(
                globalSearch.value
            )
        );

    }catch(error){

        console.error(error);

        showToast(
            "Não foi possível adicionar o contacto."
        );
    }
}


/* =========================================================
   DIRECT CHAT
========================================================= */

function directChatId(uid1,uid2){

    return [uid1,uid2]
        .sort()
        .join("_");
}


async function createOrOpenDirectChat(otherUid){

    if(!currentUser || !otherUid)
        return;

    const chatId =
        directChatId(
            currentUser.uid,
            otherUid
        );

    const ref =
        doc(db,"chats",chatId);

    try{

        const existing =
            await getDoc(ref);

        if(!existing.exists()){

            await setDoc(
                ref,
                {
                    type:"direct",
                    members:[
                        currentUser.uid,
                        otherUid
                    ],
                    createdAt:serverTimestamp(),
                    updatedAt:serverTimestamp(),
                    lastMessage:""
                }
            );

        }

        closeSearch();

        openConversation(chatId);

    }catch(error){

        console.error(error);

        showToast(
            "Não foi possível abrir a conversa."
        );
    }
}


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(chatId){

    if(!chatId) return;

    /*
     * Cancela o listener anterior antes de abrir
     * outro. Isto é importante para performance.
     */

    if(unsubscribeMessages){

        unsubscribeMessages();
        unsubscribeMessages = null;

    }

    activeConversation = chatId;

    conversation.classList.remove("hidden");

    messages.innerHTML = `
        <div class="empty">
            A carregar conversa...
        </div>
    `;

    try{

        const chatSnap =
            await getDoc(
                doc(db,"chats",chatId)
            );

        if(!chatSnap.exists())
            return;

        const chat =
            chatSnap.data();

        let title = "Grupo";
        let online = false;
        let avatarText = "G";

        if(chat.type === "group"){

            title =
                chat.name || "Grupo";

            avatarText =
                initials(title);

        }else{

            const otherUid =
                (chat.members || [])
                    .find(
                        uid =>
                            uid !== currentUser.uid
                    );

            if(otherUid){

                const profileSnap =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            otherUid
                        )
                    );

                if(profileSnap.exists()){

                    const profile =
                        profileSnap.data();

                    title =
                        profile.displayName ||
                        "Utilizador";

                    online =
                        !!profile.online;

                    avatarText =
                        initials(title);

                }
            }
        }

        $("conversationName").textContent =
            title;

        $("conversationStatus").textContent =
            chat.type === "group"
                ? "Grupo"
                : online
                    ? "online"
                    : "offline";

        $("conversationAvatar").textContent =
            avatarText;

        /*
         * Só agora ligamos o listener das mensagens.
         */

        startMessageListener(chatId);

    }catch(error){

        console.error(error);

        showToast(
            "Não foi possível abrir a conversa."
        );
    }
}


/* =========================================================
   MESSAGE LISTENER
========================================================= */

function startMessageListener(chatId){

    const messagesRef =
        collection(
            db,
            "chats",
            chatId,
            "messages"
        );

    const q =
        query(
            messagesRef,
            orderBy(
                "createdAt",
                "asc"
            ),
            limit(100)
        );

    unsubscribeMessages =
        onSnapshot(
            q,
            snapshot => {

                renderMessages(
                    snapshot.docs
                        .map(
                            doc => ({
                                id:doc.id,
                                ...doc.data()
                            })
                        )
                );

                /*
                 * Marca leitura sem bloquear o desenho
                 * da conversa.
                 */

                markConversationRead(
                    chatId,
                    snapshot.docs
                );

            },
            error => {

                console.error(
                    "Message listener:",
                    error
                );

                messages.innerHTML = `
                    <div class="empty">
                        Não foi possível carregar as mensagens.
                    </div>
                `;
            }
        );
}


function renderMessages(list){

    if(!list.length){

        messages.innerHTML = `
            <div class="empty">
                Inicia a conversa.
            </div>
        `;

        return;
    }

    messages.innerHTML =
        list.map(message => {

            const mine =
                message.senderId ===
                currentUser.uid;

            const read =
                message.readBy &&
                message.readBy.includes(
                    currentUser.uid
                );

            return `
                <div class="message ${
                    mine ? "mine" : "theirs"
                }">

                    <div class="bubble">
                        ${escapeHTML(
                            message.text || ""
                        )}
                    </div>

                    <div class="message-meta">

                        <span>
                            ${formatTime(
                                message.createdAt
                            )}
                        </span>

                        ${
                            mine
                            ? `
                                <span class="${
                                    read
                                    ? "read"
                                    : ""
                                }">
                                    ✓✓
                                </span>
                              `
                            : ""
                        }

                    </div>

                </div>
            `;

        }).join("");

    /*
     * Scroll instantâneo.
     * Não usamos animações pesadas.
     */

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

$("composer").addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if(!activeConversation)
            return;

        const text =
            messageInput.value.trim();

        if(!text) return;

        messageInput.value = "";

        const chatId =
            activeConversation;

        try{

            /*
             * A mensagem é criada primeiro.
             */

            await addDoc(
                collection(
                    db,
                    "chats",
                    chatId,
                    "messages"
                ),
                {
                    senderId:currentUser.uid,
                    text,
                    createdAt:serverTimestamp(),
                    readBy:[
                        currentUser.uid
                    ]
                }
            );

            /*
             * Atualização da lista de chats.
             */

            updateDoc(
                doc(
                    db,
                    "chats",
                    chatId
                ),
                {
                    lastMessage:text,
                    updatedAt:serverTimestamp()
                }
            ).catch(
                console.warn
            );

        }catch(error){

            console.error(error);

            messageInput.value = text;

            showToast(
                "Não foi possível enviar a mensagem."
            );
        }
    }
);


/* =========================================================
   READ RECEIPTS
========================================================= */

async function markConversationRead(
    chatId,
    messageDocs
){

    const unread =
        messageDocs.filter(doc => {

            const data = doc.data();

            return (
                data.senderId !==
                    currentUser.uid &&
                !(
                    data.readBy || []
                ).includes(
                    currentUser.uid
                )
            );

        });

    /*
     * Limitamos o número de atualizações para
     * evitar operações excessivas.
     */

    const batch =
        writeBatch(db);

    unread
        .slice(-30)
        .forEach(messageDoc => {

            batch.update(
                messageDoc.ref,
                {
                    readBy:arrayUnion(
                        currentUser.uid
                    )
                }
            );

        });

    if(unread.length){

        try{
            await batch.commit();
        }catch(error){
            console.warn(
                "Read receipt:",
                error
            );
        }
    }
}


/* =========================================================
   BACK CONVERSATION
========================================================= */

$("backConversation").addEventListener(
    "click",
    () => {

        conversation.classList.add("hidden");

        activeConversation = null;

        if(unsubscribeMessages){

            unsubscribeMessages();
            unsubscribeMessages = null;

        }

        messages.innerHTML = "";

    }
);


/* =========================================================
   TEXTAREA
========================================================= */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                120
            ) + "px";
    }
);

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            $("composer")
                .requestSubmit();

        }
    }
);


/* =========================================================
   NAVIGATION
========================================================= */

    .querySelectorAll(".nav-btn[data-page]")

$("profileButton").addEventListener(

        document
            .querySelectorAll(".page")
            .forEach(page => {
                page.classList.add(
                    "hidden"
                );
            });

        $("profilePage")
            .classList.remove(

            );

            .querySelectorAll(".nav-btn")

                );

);


/* =========================================================
   SAVE PROFILE
========================================================= */

$("saveProfile").addEventListener(
    "click",
    async () => {

        if(!currentUser) return;

        const name =
            $("editDisplayName")
                .value.trim();

        const username =
            normalizeUsername(
                $("editUsername").value
            );

        if(!name || username.length < 3){

            $("profileStatus").textContent =
                "Preenche corretamente os dados.";

            $("profileStatus")
                .className =
                "status error";

            return;
        }

        $("saveProfile").disabled = true;

        try{

            await updateDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                {
                    displayName:name,
                    username,
                    usernameLower:username
                }
            );

            currentProfile.displayName =
                name;

            currentProfile.username =
                username;

            renderProfile();

            $("profileStatus").textContent =
                "Perfil atualizado.";

            $("profileStatus")
                .className =
                "status success";

        }catch(error){

            console.error(error);

            $("profileStatus").textContent =
                "Não foi possível atualizar.";

            $("profileStatus")
                .className =
                "status error";

        }finally{

            $("saveProfile").disabled =
                false;

        }
    }
);


/* =========================================================
   GROUPS
========================================================= */

$("createGroupButton").addEventListener(
    "click",
    openGroupModal
);


$("cancelGroup").addEventListener(
    "click",
    closeGroupModal
);


function openGroupModal(){

    $("groupModal")
        .classList.remove("hidden");

    renderGroupContacts();
}


function closeGroupModal(){

    $("groupModal")
        .classList.add("hidden");

    $("groupName").value = "";

    $("groupStatus").textContent = "";
}


async function renderGroupContacts(){

    const ids =
        currentProfile?.contacts || [];

    if(!ids.length){

        $("groupContacts").innerHTML = `
            <div class="empty">
                Adiciona contactos primeiro.
            </div>
        `;

        return;
    }

    const users = [];

    await Promise.all(
        ids.map(async uid => {

            try{

                const snap =
                    await getDoc(
                        doc(db,"users",uid)
                    );

                if(snap.exists()){

                    users.push({
                        id:snap.id,
                        ...snap.data()
                    });

                }

            }catch(error){}
        })
    );

    $("groupContacts").innerHTML =
        users.map(user => {

            const name =
                user.displayName ||
                "Utilizador";

            return `
                <label
                    style="
                        display:flex;
                        align-items:center;
                        gap:10px;
                        padding:11px;
                        margin-bottom:7px;
                        border-radius:15px;
                        background:#191722;
                    ">

                    <input
                        type="checkbox"
                        value="${escapeHTML(user.uid)}">

                    <div class="avatar">
                        ${escapeHTML(
                            initials(name)
                        )}
                    </div>

                    <span>
                        ${escapeHTML(name)}
                    </span>

                </label>
            `;

        }).join("");
}


$("confirmGroup").addEventListener(
    "click",
    async () => {

        const name =
            $("groupName")
                .value.trim();

        const selected =
            [
                ...$("groupContacts")
                    .querySelectorAll(
                        "input[type=checkbox]:checked"
                    )
            ]
            .map(
                input =>
                    input.value
            );

        if(!name){

            $("groupStatus").textContent =
                "Digite o nome do grupo.";

            $("groupStatus")
                .className =
                "status error";

            return;
        }

        if(!selected.length){

            $("groupStatus").textContent =
                "Selecione pelo menos um contacto.";

            $("groupStatus")
                .className =
                "status error";

            return;
        }

        $("confirmGroup").disabled =
            true;

        try{

            const members =
                [
                    currentUser.uid,
                    ...selected
                ];

            const chatRef =
                await addDoc(
                    collection(db,"chats"),
                    {
                        type:"group",
                        name,
                        members,
                        createdBy:
                            currentUser.uid,
                        createdAt:
                            serverTimestamp(),
                        updatedAt:
                            serverTimestamp(),
                        lastMessage:""
                    }
                );

            closeGroupModal();

            showToast(
                "Grupo criado."
            );

            openConversation(
                chatRef.id
            );

        }catch(error){

            console.error(error);

            $("groupStatus").textContent =
                "Não foi possível criar o grupo.";

            $("groupStatus")
                .className =
                "status error";

        }finally{

            $("confirmGroup").disabled =
                false;

        }
    }
);


/* =========================================================
   LOGOUT
========================================================= */

$("logoutButton").addEventListener(
    "click",
    async () => {

        try{

            if(currentUser){

                await updateDoc(
                    doc(
                        db,
                        "users",
                        currentUser.uid
                    ),
                    {
                        online:false,
                        lastSeen:
                            serverTimestamp()
                    }
                ).catch(
                    () => {}
                );

            }

            await signOut(auth);

        }catch(error){

            console.error(error);

        }
    }
);


/* =========================================================
   CLEANUP
========================================================= */

function cleanupListeners(){

    if(unsubscribeChats){

        unsubscribeChats();
        unsubscribeChats = null;

    }

    if(unsubscribeContacts){

        unsubscribeContacts();
        unsubscribeContacts = null;

    }

    if(unsubscribeMessages){

        unsubscribeMessages();
        unsubscribeMessages = null;

    }

    clearInterval(
        heartbeatTimer
    );

    heartbeatTimer = null;

    activeConversation = null;
    currentProfile = null;
}

   INITIAL STATE
========================================================= */

loading.classList.remove(
    "hidden"
);
