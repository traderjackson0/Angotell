<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Angotell</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    background:#090711;
    color:#f7f3ff;
    overflow:hidden;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    color:inherit;
}

.app{
    height:100%;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(
            circle at 85% 15%,
            #26133b 0,
            #0b0913 38%,
            #06060b 100%
        );
}

.hidden{
    display:none!important;
}

.screen{
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
}

.top{
    padding:14px 18px 12px;
    border-bottom:1px solid #282333;
    background:#0d0a16;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    display:grid;
    place-items:center;

    background:
        linear-gradient(
            135deg,
            #7d42ff,
            #ff3c9e,
            #ff8443
        );

    font-weight:800;
    font-size:19px;
    flex:none;
}

.userMeta{
    min-width:0;
    flex:1;
}

.userMeta b{
    display:block;
    font-size:17px;
}

.userMeta span{
    font-size:13px;
    color:#a9a1b9;
}

.iconBtn{
    width:48px;
    height:48px;
    border-radius:16px;
    background:#171320;
    border:1px solid #30293c;
    display:grid;
    place-items:center;
    font-size:21px;
}

.content{
    flex:1;
    overflow:auto;
    padding:20px 18px 100px;
}

.title{
    font-size:23px;
    font-weight:800;
    margin:4px 0 16px;
}

.search{
    display:flex;
    gap:8px;
    background:#15111f;
    border:1px solid #302a39;
    border-radius:18px;
    padding:10px 13px;
    margin-bottom:15px;
}

.search input,
.field input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
}

.search input::placeholder,
.field input::placeholder{
    color:#777084;
}

.card{
    background:#15121d;
    border:1px solid #2c2636;
    border-radius:22px;
    padding:13px;
    margin:10px 0;

    display:flex;
    align-items:center;
    gap:12px;
}

.card .info{
    flex:1;
    min-width:0;
}

.card .info b{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card .info small{
    color:#9b93a8;
}

.primary{
    background:
        linear-gradient(
            135deg,
            #8749ff,
            #d93caa,
            #ff714b
        );

    padding:11px 17px;
    border-radius:15px;
    font-weight:800;
}

.ghost{
    background:#211b2b;
    border:1px solid #393144;
    padding:10px 14px;
    border-radius:14px;
}

.empty{
    text-align:center;
    color:#958ca3;
    padding:45px 15px;
}

.bottom{
    position:absolute;
    left:14px;
    right:14px;
    bottom:12px;

    height:66px;

    background:rgba(27,22,37,.96);
    border:1px solid #373043;
    border-radius:25px;

    display:flex;

    z-index:20;

    box-shadow:
        0 12px 35px #0008;
}

.nav{
    flex:1;
    background:none;
    color:#8e869c;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:4px;
    font-size:11px;
}

.nav.active{
    color:#fff;
}

.nav strong{
    font-size:21px;
    font-weight:400;
}

.chatHeader{
    padding:10px 12px;
    border-bottom:1px solid #282333;

    display:flex;
    align-items:center;
    gap:9px;

    background:#0d0a16;
}

.chatTitle{
    flex:1;
    min-width:0;
}

.chatTitle b,
.chatTitle small{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chatTitle small{
    color:#9f97aa;
    font-size:12px;
}

.messages{
    flex:1;
    overflow:auto;

    padding:
        15px
        13px
        90px;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.bubble{
    max-width:80%;
    padding:10px 12px;

    border-radius:17px;

    line-height:1.35;

    word-break:break-word;

    background:#211c2b;
    border:1px solid #322b3c;

    align-self:flex-start;
}

.bubble.me{
    align-self:flex-end;

    background:
        linear-gradient(
            135deg,
            #6e38d6,
            #a83eaa
        );

    border-color:#9a4ad2;
}

.bubble .time{
    display:block;
    text-align:right;

    font-size:9px;
    opacity:.7;

    margin-top:3px;
}

.composer{
    position:absolute;

    left:10px;
    right:10px;
    bottom:9px;

    display:flex;
    gap:7px;

    background:#17131f;
    border:1px solid #373042;

    padding:7px;

    border-radius:20px;

    z-index:30;
}

.composer input{
    flex:1;
    min-width:0;

    border:0;
    outline:0;

    background:transparent;
    color:#fff;

    padding:8px;
}

.send{
    width:43px;
    height:43px;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #8147ff,
            #ff4f8f
        );

    font-weight:900;
}

.modal{
    position:absolute;
    inset:0;

    background:#0009;

    z-index:50;

    display:grid;
    place-items:center;

    padding:18px;
}

.panel{
    width:min(520px,100%);
    max-height:90%;

    overflow:auto;

    background:#11101a;
    border:1px solid #373043;

    border-radius:24px;

    padding:18px;
}

.panel h2{
    margin:0 0 16px;
}

.field{
    background:#191520;
    border:1px solid #332c3b;

    border-radius:15px;

    padding:12px;

    margin:9px 0;
}

.field label{
    display:block;

    color:#968ea2;

    font-size:11px;

    margin-bottom:5px;
}

.row{
    display:flex;
    gap:8px;
}

.row>*{
    flex:1;
}

.check{
    display:flex;
    align-items:center;
    gap:10px;

    padding:9px;

    border-radius:13px;

    background:#17131f;

    margin:5px 0;
}

.auth{
    height:100%;

    display:grid;
    place-items:center;

    padding:18px;
}

.authBox{
    width:min(450px,100%);

    background:#11101a;

    border:1px solid #322c3a;

    border-radius:30px;

    padding:25px;
}

.logo{
    width:78px;
    height:78px;

    border-radius:24px;

    display:grid;
    place-items:center;

    margin:0 auto 13px;

    background:
        linear-gradient(
            135deg,
            #ff3c91,
            #8b49ff,
            #19caff
        );

    font-size:40px;
    font-weight:900;
}

.auth h1{
    text-align:center;
    margin:0;
}

.auth p{
    text-align:center;
    color:#938a9f;
}

.tabs{
    display:flex;

    background:#17131f;

    padding:4px;

    border-radius:15px;

    margin:18px 0;
}

.tabs button{
    flex:1;

    padding:11px;

    border-radius:12px;

    background:none;

    color:#968da3;
}

.tabs .sel{
    background:#65328d;
    color:#fff;
}

.status{
    min-height:20px;

    text-align:center;

    color:#ff7797;

    font-size:12px;

    margin-top:10px;
}

.toast{
    position:absolute;

    left:20px;
    right:20px;

    bottom:90px;

    z-index:100;

    background:#24202e;

    border:1px solid #4a4153;

    border-radius:16px;

    padding:12px;

    text-align:center;
}

.spinner{
    display:inline-block;

    width:16px;
    height:16px;

    border:2px solid #ffffff44;

    border-top-color:#fff;

    border-radius:50%;

    animation:r .7s linear infinite;

    vertical-align:middle;
}

@keyframes r{
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="app">

<!-- ========================= -->
<!-- LOGIN / CADASTRO -->
<!-- ========================= -->

<section id="authScreen" class="auth screen">

<div class="authBox">

<div class="logo">A</div>

<h1>Angotell</h1>

<p>
Comunicação de nova geração.
</p>

<div class="tabs">

<button id="loginTab" class="sel">
Entrar
</button>

<button id="registerTab">
Criar conta
</button>

</div>

<div id="registerFields" class="hidden">

<div class="field">

<label>
Nome público
</label>

<input
id="publicName"
placeholder="Como as pessoas verão você">

</div>

<div class="field">

<label>
Nome de utilizador
</label>

<input
id="username"
placeholder="ex.: jackson007">

</div>

</div>

<div class="field">

<label>
E-mail
</label>

<input
id="email"
type="email"
autocomplete="email">

</div>

<div class="field">

<label>
Senha
</label>

<input
id="password"
type="password"
autocomplete="current-password">

</div>

<button
id="authBtn"
class="primary"
style="width:100%;padding:14px">

Entrar no Angotell

</button>

<div
id="authStatus"
class="status">
</div>

</div>

</section>


<!-- ========================= -->
<!-- APLICAÇÃO -->
<!-- ========================= -->

<section
id="mainScreen"
class="screen hidden">

<header class="top">

<div
id="topAvatar"
class="avatar">
A
</div>

<div class="userMeta">

<b id="topName">
Angotell
</b>

<span id="topUsername">
@utilizador
</span>

</div>

<button
class="iconBtn"
id="globalSearchBtn">
⌕
</button>

<button
class="iconBtn"
id="profileBtn">
◎
</button>

</header>

<main
id="home"
class="content">
</main>


<!-- BARRA INFERIOR -->

<nav class="bottom">

<button
class="nav active"
data-page="chats">

<strong>◉</strong>
Conversas

</button>

<button
class="nav"
data-page="contacts">

<strong>♧</strong>
Contactos

</button>

<button
class="nav"
data-page="groups">

<strong>＋</strong>
Grupo

</button>

<button
class="nav"
data-page="profile">

<strong>◎</strong>
Perfil

</button>

</nav>

</section>


<!-- ========================= -->
<!-- TELA DE CONVERSA -->
<!-- ========================= -->

<section
id="chatScreen"
class="screen hidden"
style="position:absolute;inset:0;background:#08070d;z-index:40">

<header class="chatHeader">

<button
class="iconBtn"
id="backChat">
‹
</button>

<div
id="chatAvatar"
class="avatar"
style="width:42px;height:42px">
A
</div>

<div class="chatTitle">

<b id="chatName">
Conversa
</b>

<small id="chatStatus">
online
</small>

</div>

<button
class="iconBtn"
id="chatInfo">
⋮
</button>

</header>


<div
id="messages"
class="messages">
</div>


<form
id="composer"
class="composer">

<input
id="messageInput"
autocomplete="off"
placeholder="Escreva uma mensagem…">

<button class="send">
➤
</button>

</form>

</section>


<div
id="modal"
class="modal hidden">
</div>

<div
id="toast"
class="toast hidden">
</div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
doc,
setDoc,
getDoc,
addDoc,
collection,
query,
where,
onSnapshot,
serverTimestamp,
updateDoc,
arrayUnion,
orderBy,
limit,
getDocs,
deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyBl_SqID26LfAIYrd9HykCETmNLb7d66m4",

authDomain:
"angotell.firebaseapp.com",

projectId:
"angotell",

storageBucket:
"angotell.firebasestorage.app",

messagingSenderId:
"241567716431",

appId:
"1:241567716431:web:ffd859078a6198bc17463a"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================================================
   ESTADO
========================================================= */

let me = null;

let userData = null;

let activeChat = null;

let unsubChats = null;

let unsubMessages = null;

let unsubContacts = null;

let authMode = "login";

let searchTimer = null;


/* =========================================================
   UTILITÁRIOS
========================================================= */

const $ =
id => document.getElementById(id);


const esc =
s =>
String(s ?? "")
.replace(
/[&<>"']/g,
m =>
({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"\"":"&quot;",
"'":"&#39;"
}[m])
);


function toast(text){

$("toast").textContent = text;

$("toast").classList.remove("hidden");

clearTimeout(window.__toast);

window.__toast =
setTimeout(
() =>
$("toast").classList.add("hidden"),
2600
);

}


function setAuthStatus(text,loading=false){

$("authStatus").innerHTML =
loading
?
'<span class="spinner"></span> '+esc(text)
:
esc(text);

}


function initials(name){

return (
String(name || "A")
.trim()
.split(/\s+/)
.slice(0,2)
.map(x => x[0])
.join("")
|| "A"
)
.toUpperCase();

}


function fmt(ts){

try{

let d =
ts?.toDate
?
ts.toDate()
:
new Date(ts);

return d.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}


/* =========================================================
   ID DETERMINÍSTICO DO CHAT
========================================================= */

function chatIdFor(a,b){

return [a,b]
.sort()
.join("__");

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function switchPage(page){

document
.querySelectorAll(".nav")
.forEach(
x =>
x.classList.toggle(
"active",
x.dataset.page === page
)
);


if(page === "chats")
renderChats();


if(page === "contacts")
renderContacts();


if(page === "groups")
renderGroups();


if(page === "profile")
renderProfile();

}


/* =========================================================
   LOGIN / CADASTRO
========================================================= */

$("loginTab").onclick = () => {

authMode = "login";

$("loginTab").classList.add("sel");

$("registerTab").classList.remove("sel");

$("registerFields")
.classList.add("hidden");

$("authBtn").textContent =
"Entrar no Angotell";

setAuthStatus("");

};


$("registerTab").onclick = () => {

authMode = "register";

$("registerTab").classList.add("sel");

$("loginTab").classList.remove("sel");

$("registerFields")
.classList.remove("hidden");

$("authBtn").textContent =
"Criar conta Angotell";

setAuthStatus("");

};


$("authBtn").onclick =
async () => {

try{

setAuthStatus(
authMode === "login"
?
"A entrar…"
:
"A criar conta…",
true
);


const email =
$("email").value.trim();

const password =
$("password").value;


if(!email || !password){

throw Error(
"Preencha o e-mail e a senha."
);

}


/* LOGIN */

if(authMode === "login"){

await signInWithEmailAndPassword(
auth,
email,
password
);

return;

}


/* CADASTRO */

const name =
$("publicName")
.value
.trim();


const username =
$("username")
.value
.trim()
.toLowerCase()
.replace(
/[^a-z0-9_.-]/g,
""
);


if(!name || !username){

throw Error(
"Preencha o nome público e o nome de utilizador."
);

}


const cred =
await createUserWithEmailAndPassword(
auth,
email,
password
);


await updateProfile(
cred.user,
{
displayName:name
}
);


await setDoc(
doc(
db,
"users",
cred.user.uid
),
{

uid:
cred.user.uid,

publicName:
name,

username:
username,

email:
email,

online:true,

lastSeen:
serverTimestamp(),

createdAt:
serverTimestamp()

}
);


await setDoc(
doc(
db,
"usernames",
username
),
{
uid:cred.user.uid
}
);


}catch(e){

console.error(e);

setAuthStatus(
e.code ===
"auth/email-already-in-use"
?
"Este e-mail já está registado."
:
e.message ||
"Não foi possível concluir."
);

}

};


/* =========================================================
   AUTENTICAÇÃO
========================================================= */

onAuthStateChanged(
auth,
async user => {

if(!user){

me = null;

$("authScreen")
.classList.remove("hidden");

$("mainScreen")
.classList.add("hidden");

return;

}


me = user;


try{

await ensureUser(user);

$("authScreen")
.classList.add("hidden");

$("mainScreen")
.classList.remove("hidden");


await loadUser();


listenContacts();

listenChats();

switchPage("chats");

setOnline(true);


}catch(e){

console.error(e);

toast(
"Erro ao carregar o perfil: "
+
e.message
);

}

});


/* =========================================================
   GARANTIR PERFIL
========================================================= */

async function ensureUser(user){

const ref =
doc(
db,
"users",
user.uid
);

const snapshot =
await getDoc(ref);


if(!snapshot.exists()){

await setDoc(
ref,
{

uid:
user.uid,

publicName:
user.displayName ||
"Utilizador Angotell",

username:
(user.email || "utilizador")
.split("@")[0]
.toLowerCase(),

email:
user.email,

online:true,

lastSeen:
serverTimestamp(),

createdAt:
serverTimestamp()

},
{
merge:true
}
);

}

}


/* =========================================================
   CARREGAR PERFIL
========================================================= */

async function loadUser(){

const snapshot =
await getDoc(
doc(
db,
"users",
me.uid
)
);


userData =
snapshot.data() || {};


$("topName")
.textContent =
userData.publicName ||
me.displayName ||
"Utilizador";


$("topUsername")
.textContent =
"@" +
(
userData.username ||
"utilizador"
);


$("topAvatar")
.textContent =
initials(
userData.publicName ||
me.displayName
);

}


/* =========================================================
   PRESENÇA
========================================================= */

async function setOnline(value){

try{

await updateDoc(
doc(
db,
"users",
me.uid
),
{

online:value,

lastSeen:
serverTimestamp()

}
);

}catch{}

}


document.addEventListener(
"visibilitychange",
() => {

if(me){

setOnline(
document.visibilityState ===
"visible"
);

}

}
);


/* =========================================================
   CONTACTOS
========================================================= */

function listenContacts(){

if(unsubContacts)
unsubContacts();


unsubContacts =
onSnapshot(
collection(
db,
"users",
me.uid,
"contacts"
),

snapshot => {

window.__contacts =
snapshot.docs.map(
d => ({
id:d.id,
...d.data()
})
);


if(
document
.querySelector(".nav.active")
?.dataset.page ===
"contacts"
){

renderContacts();

}

},

error => {

console.error(error);

}
);

}


/* =========================================================
   CHATS
========================================================= */

function listenChats(){

if(unsubChats)
unsubChats();


const q =
query(
collection(db,"chats"),
where(
"members",
"array-contains",
me.uid
)
);


unsubChats =
onSnapshot(
q,
snapshot => {

window.__chats =
snapshot.docs.map(
d => ({
id:d.id,
...d.data()
})
);


if(
document
.querySelector(".nav.active")
?.dataset.page ===
"chats"
){

renderChats();

}

},

error => {

console.error(error);

toast(
"Não foi possível carregar as conversas."
);

}
);

}


/* =========================================================
   LISTA DE CONVERSAS
========================================================= */

function renderChats(){

const chats =
(window.__chats || [])
.sort(
(a,b) =>
(
b.updatedAt?.toMillis?.() || 0
)
-
(
a.updatedAt?.toMillis?.() || 0
)
);


$("home").innerHTML =

'<div class="title">As minhas conversas</div>' +

(
chats.length

?

chats.map(c => {

const other =
c.type === "group"
?
null
:
c.members.find(
x => x !== me.uid
);

const name =
c.type === "group"

?

(
c.name ||
"Grupo"
)

:

(
c.memberNames?.[other] ||
"Utilizador"
);


return `

<div
class="card"
data-chat="${esc(c.id)}">

<div class="avatar">

${esc(initials(name))}

</div>

<div class="info">

<b>
${esc(name)}
</b>

<small>
${esc(
c.lastMessage ||
"Toque para conversar"
)}
</small>

</div>

<small>
${fmt(c.updatedAt)}
</small>

</div>

`;

}).join("")

:

`
<div class="empty">

Ainda não há conversas.

/* =========================================================
   PESQUISA
========================================================= */

async function searchUsers(term){

clearTimeout(searchTimer);


const box =
$("contactResults");


if(!box)
return;


if(!term.trim()){

box.innerHTML = "";

return;

}


box.innerHTML = `

<div class="empty">

<span class="spinner"></span>

Pesquisando…

</div>

`;


searchTimer =
setTimeout(
async () => {

try{

const value =
term
.trim()
.toLowerCase();


const q =
query(
collection(db,"users"),

where(
"username",
">=",
value
),

where(
"username",
"<=",
value + "\uf8ff"
),

limit(20)
);


const snapshot =
await getDocs(q);


const results =
snapshot.docs
.map(
d => d.data()
)
.filter(
u =>
u.uid !== me.uid
);


box.innerHTML =

results.length

?

`
<div
class="title"
style="font-size:16px">

Resultados

</div>

` +

results
.map(
u => `

<div class="card">

<div class="avatar">

${esc(
initials(
u.publicName
)
)}

</div>

<div class="info">

<b>
${esc(
u.publicName
)}
</b>

<small>
@${esc(
u.username
)}
</small>

</div>

<button
class="primary"
data-add="${esc(u.uid)}">

Adicionar

</button>

</div>

`
)
.join("")

:

`
<div class="empty">

Nenhum perfil encontrado.

</div>
`;


document
.querySelectorAll(
"[data-add]"
)
.forEach(
x =>
x.onclick =
() =>
addContact(
x.dataset.add
)
);


}catch(e){

console.error(e);

box.innerHTML = `

<div class="empty">
Erro na pesquisa.
</div>

`;

}

},
180
);

}


/* =========================================================
   ADICIONAR CONTACTO
========================================================= */

async function addContact(uid){

try{

const snapshot =
await getDoc(
doc(
db,
"users",
uid
)
);


if(!snapshot.exists()){

toast(
"Utilizador não encontrado."
);

return;

}


const user =
snapshot.data();


await setDoc(
doc(
db,
"users",
me.uid,
"contacts",
uid
),
{

uid:uid,

publicName:
user.publicName,

username:
user.username,

online:
user.online || false,

addedAt:
serverTimestamp()

},
{
merge:true
}
);


toast(
"Contacto guardado."
);


renderContacts();


}catch(e){

console.error(e);

toast(
"Não foi possível adicionar o contacto."
);

}

}

/* =========================================================
   CRIAR / ABRIR CONVERSA PRIVADA
========================================================= */

async function startPrivate(uid){

try{

toast(
"A abrir conversa…"
);


const id =
chatIdFor(
me.uid,
uid
);


const chatRef =
doc(
db,
"chats",
id
);


const otherSnapshot =
await getDoc(
doc(
db,
"users",
uid
)
);


if(!otherSnapshot.exists()){

throw Error(
"Contacto não encontrado."
);

}


const other =
otherSnapshot.data();


const chatSnapshot =
await getDoc(chatRef);


/*

SE NÃO EXISTE:

CRIA AUTOMATICAMENTE.

*/

if(!chatSnapshot.exists()){

await setDoc(
chatRef,
{

id:id,

type:"private",

members:[
me.uid,
uid
],

memberNames:{
[me.uid]:
userData.publicName,

[uid]:
other.publicName ||
"Utilizador"
},

lastMessage:"",

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp()

}
);

}


/*

ABRE O CHAT.

*/

await openChat(id);


}catch(e){

console.error(e);

toast(
"Não foi possível abrir a conversa: "
+
(e.message || "")
);

}

}


/* =========================================================
   ABRIR CHAT
========================================================= */

async function openChat(id){

try{

const snapshot =
await getDoc(
doc(
db,
"chats",
id
)
);


if(!snapshot.exists()){

throw Error(
"A conversa não existe."
);

}


const chat = {

id:id,

...snapshot.data()

};


if(
!(chat.members || [])
.includes(me.uid)
){

throw Error(
"Você não pertence a esta conversa."
);

}


activeChat = chat;


/*

ESCONDE APP PRINCIPAL.

*/

$("mainScreen")
.classList.add(
"hidden"
);


/*

ABRE CONVERSA.

*/

$("chatScreen")
.classList.remove(
"hidden"
);


const other =
chat.type === "group"

?

null

:

chat.members.find(
x => x !== me.uid
);


const name =
chat.type === "group"

?

(
chat.name ||
"Grupo"
)

:

(
chat.memberNames?.[other] ||
"Conversa"
);


$("chatName")
.textContent =
name;


$("chatAvatar")
.textContent =
initials(name);


$("chatStatus")
.textContent =

chat.type === "group"

?

`${chat.members.length} participantes`

:

"conversa em tempo real";


$("messageInput").focus();


listenMessages(id);


}catch(e){

console.error(e);

toast(
"Não foi possível abrir a conversa."
);

}

}


/* =========================================================
   MENSAGENS EM TEMPO REAL
========================================================= */

function listenMessages(id){

if(unsubMessages)
unsubMessages();


const q =
query(
collection(
db,
"chats",
id,
"messages"
),

orderBy(
"createdAt",
"asc"
),

limit(200)
);


unsubMessages =
onSnapshot(
q,

snapshot => {


const messages =
snapshot.docs.map(
d => ({
id:d.id,
...d.data()
})
);


$("messages").innerHTML =

messages.length

?

messages
.map(
m => `

<div
class="bubble ${
m.senderId === me.uid
?
"me"
:
""
}">

${esc(m.text)}

<span class="time">

${fmt(m.createdAt)}

${
m.senderId === me.uid

?

(
m.readBy?.length > 1
?
"✓✓"
:
"✓"
)

:

""

}

</span>

</div>

`
)
.join("")

:

`

<div class="empty">

Nenhuma mensagem ainda.

<br>

Comece a conversa.

</div>

`;


requestAnimationFrame(
() => {

$("messages").scrollTop =
$("messages").scrollHeight;

}
);


/*

MARCAR MENSAGENS RECEBIDAS
COMO LIDAS.

*/

markIncomingRead(
id,
messages
)
.catch(
() => {}
);


},

error => {

console.error(error);

toast(
"Erro ao receber mensagens em tempo real."
);

}

);

}


/* =========================================================
   RECIBOS DE LEITURA
========================================================= */

async function markIncomingRead(
chatId,
messages
){

const pending =
messages.filter(
m =>

m.senderId !== me.uid &&

!(m.readBy || [])
.includes(me.uid)

);


if(!pending.length)
return;


await Promise.all(

pending.map(
m =>

updateDoc(
doc(
db,
"chats",
chatId,
"messages",
m.id
),

{
readBy:
arrayUnion(me.uid)
}

)
.catch(
() => {}
)

)

);

}


/* =========================================================
   ENVIAR MENSAGEM
========================================================= */

$("composer").onsubmit =
async event => {

event.preventDefault();


const input =
$("messageInput");


const text =
input.value.trim();


if(
!text ||
!activeChat
)
return;


const chatId =
activeChat.id;


input.value = "";


try{


/*

CRIA MENSAGEM REAL.

*/

await addDoc(
collection(
db,
"chats",
chatId,
"messages"
),
{

text:text,

senderId:
me.uid,

senderName:
userData.publicName,

createdAt:
serverTimestamp(),

readBy:[
me.uid
]

}
);


/*

ATUALIZA CONVERSA.

*/

await updateDoc(
doc(
db,
"chats",
chatId
),
{

lastMessage:
text.slice(0,120),

lastSenderId:
me.uid,

updatedAt:
serverTimestamp()

}
);


}catch(e){

console.error(e);


input.value =
text;


toast(
"Mensagem não enviada. Verifique as regras do Firestore."
);

}

};


/* =========================================================
   VOLTAR

$("backChat").onclick =

/* =========================================================
   CRIAR GRUPO
========================================================= */

async function createGroup(){

try{

const name =
$("groupName")
.value
.trim();


const ids =
[
...
document.querySelectorAll(
'#modal input[type="checkbox"]:checked'
)
]
.map(
x =>
x.value
);


if(!name){

throw Error(
"Dê um nome ao grupo."
);

}


if(!ids.length){

throw Error(
"Selecione pelo menos um contacto."
);

}


const members =
[
me.uid,
...ids
];


const names = {

[me.uid]:
userData.publicName

};


for(
const id of ids
){

const snapshot =
await getDoc(
doc(
db,
"users",
id
)
);


if(snapshot.exists()){

names[id] =
snapshot.data()
.publicName ||
"Utilizador";

}

}


/*

DOCUMENTO DO GRUPO.

*/

const groupRef =
doc(
collection(
db,
"chats"
)
);


await setDoc(
groupRef,
{

id:
groupRef.id,

type:
"group",

name:name,

members:
members,

memberNames:
names,

lastMessage:"",

createdAt:
serverTimestamp(),

updatedAt:
serverTimestamp(),

createdBy:
me.uid

}
);


closeModal();


toast(
"Grupo criado com sucesso."
);


await openChat(
groupRef.id
);


}catch(e){

console.error(e);

const status =
$("groupStatus");


if(status){

status.textContent =
e.message ||
"Não foi possível criar o grupo.";

}

}

}
