<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0912">
<title>Angotell</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#08070d;
  color:#f7f2ff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.screen{
  width:100%;
  height:100dvh;
  position:relative;
}

.app{
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 90% 15%,rgba(174,72,255,.12),transparent 30%),
    radial-gradient(circle at 10% 85%,rgba(255,65,145,.08),transparent 35%),
    #08070d;
}

/* AUTH */

.auth{
  width:min(620px,100%);
  height:100%;
  margin:auto;
  padding:26px 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-y:auto;
}

.auth-card{
  width:100%;
  max-width:560px;
  padding:28px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:30px;
  background:rgba(17,14,26,.90);
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.logo{
  width:105px;
  height:105px;
  margin:0 auto 18px;
  border-radius:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:62px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,#7d4cff,#ff3f91,#ff7b3d,#00d9ff);
  box-shadow:0 0 45px rgba(188,75,255,.35);
}

.brand{
  text-align:center;
  font-size:38px;
  font-weight:900;
  letter-spacing:-1px;
}

.subtitle{
  text-align:center;
  opacity:.58;
  line-height:1.6;
  margin:12px auto 25px;
}

.tabs{
  display:flex;
  padding:5px;
  border-radius:18px;
  background:#17131f;
  margin-bottom:22px;
}

.tab{
  flex:1;
  padding:14px;
  border-radius:14px;
  background:transparent;
  color:#aaa2b4;
}

.tab.active{
  color:white;
  background:linear-gradient(135deg,#7142d9,#c43691);
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin:0 0 7px 4px;
  font-size:13px;
  opacity:.65;
}

.field input{
  width:100%;
  height:54px;
  padding:0 17px;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.10);
  background:#17141e;
  color:white;
  outline:none;
}

.field input:focus{
  border-color:#a34cff;
  box-shadow:0 0 0 3px rgba(163,76,255,.12);
}

.primary{
  width:100%;
  min-height:55px;
  border-radius:18px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#8148ff,#e63a99,#ff7541);
}

.primary:disabled{
  opacity:.5;
}

.error{
  margin-top:14px;
  padding:12px;
  border-radius:14px;
  background:rgba(255,45,100,.10);
  color:#ff719d;
  text-align:center;
  font-size:13px;
}

/* APP HEADER */

.main{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.topbar{
  flex:none;
  min-height:92px;
  padding:16px 20px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:rgba(9,8,14,.88);
  backdrop-filter:blur(18px);
}

.identity{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.avatar{
  width:56px;
  height:56px;
  flex:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,#8745ff,#ff3d91);
  position:relative;
}

.online-dot{
  width:13px;
  height:13px;
  border-radius:50%;
  background:#35e895;
  border:2px solid #09080e;
  position:absolute;
  right:0;
  bottom:1px;
}

.identity-text{
  min-width:0;
}

.identity-name{
  font-size:18px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.identity-user{
  opacity:.5;
  font-size:13px;
}

.top-actions{
  display:flex;
  gap:10px;
}

.icon-btn{
  width:54px;
  height:54px;
  border-radius:18px;
  color:white;
  background:#17141f;
  border:1px solid rgba(255,255,255,.08);
  font-size:21px;
}

/* CONTENT */

.content{
  flex:1;
  min-height:0;
  overflow:hidden;
  position:relative;
}

.page{
  width:100%;
  height:100%;
  overflow-y:auto;
  padding:24px 20px 105px;
}

.page-title{
  font-size:24px;
  font-weight:900;
  margin-bottom:18px;
}

.search{
  width:100%;
  height:52px;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.08);
  background:#14111c;
  color:white;
  padding:0 17px;
  outline:none;
  margin-bottom:18px;
}

.card{
  padding:15px;
  border-radius:23px;
  background:#15121d;
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:12px;
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
}

.person-info{
  flex:1;
  min-width:0;
}

.person-name{
  font-weight:800;
  font-size:16px;
}

.person-user{
  opacity:.5;
  font-size:13px;
  margin-top:2px;
}

.action{
  flex:none;
  padding:12px 17px;
  border-radius:15px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#7545e8,#db419c);
}

.muted{
  opacity:.45;
  text-align:center;
  padding:30px 10px;
}

/* CHAT */

.chat{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#09080f;
}

.chat-header{
  min-height:72px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:#0d0b14;
}

.back{
  width:45px;
  height:45px;
  border-radius:15px;
  color:white;
  background:#181520;
  font-size:21px;
}

.chat-title{
  flex:1;
  min-width:0;
}

.chat-name{
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-status{
  font-size:12px;
  opacity:.5;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:16px 14px;
}

.message-row{
  display:flex;
  margin:7px 0;
}

.message-row.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:78%;
  padding:10px 13px 7px;
  border-radius:19px;
  background:#1b1824;
  border:1px solid rgba(255,255,255,.05);
}

.mine .bubble{
  background:linear-gradient(135deg,#693dcc,#b33791);
}

.message-text{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-meta{
  text-align:right;
  font-size:10px;
  opacity:.55;
  margin-top:4px;
}

.composer{
  flex:none;
  display:flex;
  gap:8px;
  padding:9px 10px max(9px,env(safe-area-inset-bottom));
  background:#0d0b14;
  border-top:1px solid rgba(255,255,255,.06);
}

.composer input{
  flex:1;
  min-width:0;
  height:50px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:0 16px;
  background:#191620;
  color:white;
  outline:none;
}

.send{
  width:52px;
  height:50px;
  border-radius:17px;
  color:white;
  background:linear-gradient(135deg,#7947f1,#ec429c);
  font-size:20px;
}

/* BOTTOM */

.bottom{
  position:absolute;
  z-index:20;
  left:18px;
  right:18px;
  bottom:max(12px,env(safe-area-inset-bottom));
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  border-radius:25px;
  background:rgba(24,20,32,.94);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 12px 35px rgba(0,0,0,.35);
  backdrop-filter:blur(18px);
}

.nav{
  flex:1;
  height:100%;
  color:#85808e;
  background:transparent;
  font-size:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.nav-icon{
  font-size:20px;
}

.nav.active{
  color:white;
}

.nav.add{
  font-size:30px;
}

/* MODAL */

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(5px);
}

.modal-card{
  width:min(600px,100%);
  max-height:90dvh;
  overflow-y:auto;
  padding:22px;
  border-radius:30px 30px 0 0;
  background:#15121d;
  border:1px solid rgba(255,255,255,.09);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-title{
  font-size:21px;
  font-weight:900;
}

.close{
  width:42px;
  height:42px;
  border-radius:14px;
  color:white;
  background:#211d29;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:98px;
  transform:translateX(-50%);
  max-width:90%;
  padding:13px 18px;
  border-radius:17px;
  background:#25202e;
  color:white;
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 10px 35px rgba(0,0,0,.35);
  text-align:center;
  font-size:13px;
}

/* PROFILE */

.profile-card{
  text-align:center;
  padding:25px 20px;
}

.profile-big{
  width:90px;
  height:90px;
  margin:auto auto 14px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:900;
  background:linear-gradient(135deg,#8049ff,#ff3c91);
}

/* MOBILE */

@media(max-width:500px){
  .auth{
    padding:10px 12px;
  }

  .auth-card{
    padding:22px 17px;
    border-radius:26px;
  }

  .logo{
    width:88px;
    height:88px;
    font-size:51px;
  }

  .brand{
    font-size:32px;
  }

  .topbar{
    padding-left:14px;
    padding-right:14px;
  }

  .page{
    padding-left:14px;
    padding-right:14px;
  }

  .bottom{
    left:12px;
    right:12px;
  }
}
</style>
</head>

<body>

<div id="authScreen" class="screen">
  <div class="auth">
    <div class="auth-card">

      <div class="logo">A</div>

      <div class="brand">Angotell</div>

<div id="appScreen" class="screen hidden">

</div>


<!-- CHAT -->

<div id="chatScreen" class="screen hidden">

  <div class="chat">

    <header class="chat-header">

      <button id="closeChatBtn" class="back">‹</button>

      <div id="chatAvatar" class="avatar">A</div>

      <div class="chat-title">
        <div id="chatName" class="chat-name">Conversa</div>
        <div id="chatStatus" class="chat-status"></div>

    <div id="messages" class="messages"></div>

<!-- GROUP MODAL -->

      Criar grupo
    </button>

</div>


<div id="toast" class="toast hidden"></div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  getDocs,
  setDoc,
  updateDoc,
  addDoc,
  collection,
  query,
  where,
  orderBy,
  limit,
  limitToLast,
  onSnapshot,
  serverTimestamp,
  arrayUnion
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBl_SqID26LfAIYrd9HykCETmNLb7d66m4",
  authDomain: "angotell.firebaseapp.com",
  projectId: "angotell",
  storageBucket: "angotell.firebasestorage.app",
  messagingSenderId: "241567716431",
  appId: "1:241567716431:web:ffd859078a6198bc17463a"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


/* =========================================================
   ESTADO
========================================================= */

let me = null;
let myProfile = null;

let activeChat = null;
let activeChatUnsubscribe = null;

let contactsUnsubscribe = null;
let conversationsUnsubscribe = null;
let groupsUnsubscribe = null;

let searchTimer = null;

const $ = id => document.getElementById(id);


/* =========================================================
   UTILIDADES
========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initials(name){
  const value = String(name || "A").trim();
  const parts = value.split(/\s+/).filter(Boolean);

  if(parts.length === 1){
    return parts[0].slice(0,2).toUpperCase();
  }

  return (
    parts[0][0] +
    parts[parts.length - 1][0]
  ).toUpperCase();
}

function showToast(message){
  $("toast").textContent = message;
  $("toast").classList.remove("hidden");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(() => {
    $("toast").classList.add("hidden");
  },3000);
}

function showAuthError(message){
  $("authError").textContent = message;
  $("authError").classList.remove("hidden");
}

function clearAuthError(){
  $("authError").classList.add("hidden");
}

function friendlyError(error){
  const code = error?.code || "";

  const map = {
    "auth/email-already-in-use": "Este e-mail já possui uma conta.",
    "auth/invalid-email": "O e-mail não é válido.",
    "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/user-not-found": "Utilizador não encontrado.",
    "auth/wrong-password": "Senha incorreta.",
    "permission-denied": "Sem permissão no Firebase. Verifica as regras do Firestore.",
    "failed-precondition": "O Firestore precisa de uma configuração adicional.",
    "unavailable": "Firebase temporariamente indisponível. Verifica a internet."
  };

  return map[code] || error?.message || "Ocorreu um erro.";
}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function showPage(pageId){
  document.querySelectorAll(".page").forEach(page => {
    page.classList.add("hidden");
  });

  $(pageId).classList.remove("hidden");

  document.querySelectorAll(".nav").forEach(btn => {
    btn.classList.toggle(
      "active",
      btn.dataset.page === pageId
    );
  });
}

document.querySelectorAll(".nav[data-page]").forEach(button => {
  button.addEventListener("click",() => {
    showPage(button.dataset.page);

    if(button.dataset.page === "contactsPage"){
      loadContacts();
    }

    if(button.dataset.page === "groupsPage"){
      loadGroups();
    }
  });
});


/* =========================================================
   LOGIN / CADASTRO
========================================================= */

let authMode = "login";

$("loginTab").onclick = () => {
  authMode = "login";
  $("loginTab").classList.add("active");
  $("registerTab").classList.remove("active");
  $("registerFields").classList.add("hidden");
  $("authButton").textContent = "Entrar no Angotell";
  clearAuthError();
};

$("registerTab").onclick = () => {
  authMode = "register";
  $("registerTab").classList.add("active");
  $("loginTab").classList.remove("active");
  $("registerFields").classList.remove("hidden");
  $("authButton").textContent = "Criar conta Angotell";
  clearAuthError();
};

$("authButton").onclick = async () => {
  clearAuthError();

  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;

  if(!email || !password){
    showAuthError("Preenche o e-mail e a senha.");
    return;
  }

  $("authButton").disabled = true;

  try{
    if(authMode === "login"){
      await signInWithEmailAndPassword(auth, email, password);
    }else{
      const publicName = $("regName").value.trim();
      const username = $("regUsername").value.trim();

      if(!publicName || !username){
        throw new Error("Preenche o nome público e o nome de utilizador.");
      }

      const usernameClean = username.toLowerCase().replace(/[^a-z0-9_.]/g,"");

      if(usernameClean.length < 3){
        throw new Error("O nome de utilizador precisa ter pelo menos 3 caracteres.");
      }

      const usernameRef = doc(db,"usernames",usernameClean);
      const usernameSnap = await getDoc(usernameRef);

      if(usernameSnap.exists()){
        throw new Error("Este nome de utilizador já está ocupado.");
      }

      const credential = await createUserWithEmailAndPassword(auth, email, password);
      const user = credential.user;

      await updateProfile(user,{ displayName: publicName });

      await setDoc(
        doc(db,"users",user.uid),
        {
          uid:user.uid,
          publicName,
          username:usernameClean,
          usernameLower:usernameClean,
          publicNameLower:publicName.toLowerCase(),
          email,
          online:true,
          lastSeen:serverTimestamp(),
          createdAt:serverTimestamp()
        },
        {merge:true}
      );

      await setDoc(
        usernameRef,
        {
          uid:user.uid,
          username:usernameClean
        },
        {merge:true}
      );
    }
  }catch(error){
    console.error(error);
    showAuthError(friendlyError(error));
  }finally{
    $("authButton").disabled = false;
  }
};

async function loadMyProfile(){
  const ref = doc(db,"users",me.uid);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    const fallbackName = me.displayName || me.email?.split("@")[0] || "Utilizador";
    const fallbackUsername = (me.email?.split("@")[0] || ("user" + me.uid.slice(0,7)))
      .toLowerCase()
      .replace(/[^a-z0-9_.]/g,"");

    myProfile = {
      uid:me.uid,
      publicName:fallbackName,
      username:fallbackUsername,
      usernameLower:fallbackUsername,
      publicNameLower:fallbackName.toLowerCase(),
      email:me.email || "",
      online:true
    };

    await setDoc(
      ref,
      {
        ...myProfile,
        createdAt:serverTimestamp(),
        lastSeen:serverTimestamp()
      },
      {merge:true}
    );
  }else{
    myProfile = {
      uid:me.uid,
      ...snap.data()
    };
  }

  renderProfile();
}

function renderProfile(){
  if(!myProfile) return;

  const name = myProfile.publicName || myProfile.username || "Utilizador";
  const username = myProfile.username || "utilizador";

  $("topName").textContent = name;
  $("topUsername").textContent = "@" + username;
  $("topAvatar").childNodes[0].nodeValue = initials(name) + " ";
  $("profileAvatar").textContent = initials(name);
  $("profilePublicName").textContent = name;
  $("profileUsername").textContent = "@" + username;
  $("profileNameInput").value = name;
  $("profileUsernameInput").value = username;
}

async function setOnline(value){
  if(!me) return;
  await setDoc(
    doc(db,"users",me.uid),
    {
      online:value,
      lastSeen:serverTimestamp()
    },
    {merge:true}
  );
}

window.addEventListener("pagehide",() => {

$("saveProfileBtn").onclick = async () => {
  if(!me) return;

  const name = $("profileNameInput").value.trim();
  const username = $("profileUsernameInput").value.trim().toLowerCase().replace(/[^a-z0-9_.]/g,"");

  if(name.length < 2){

    return;
  }

  if(username.length < 3){
    showToast("Nome de utilizador inválido.");

async function searchUsers(term){
  const results = new Map();

  try{
    const usernameQuery = query(
      collection(db,"users"),
      where("usernameLower", ">=", term),
      where("usernameLower", "<=", term + "\uf8ff"),
      limit(15)
    );

    const nameQuery = query(
      collection(db,"users"),
      where("publicNameLower", ">=", term),
      where("publicNameLower", "<=", term + "\uf8ff"),
      limit(15)
    );

    const [usernameSnap, nameSnap] = await Promise.all([
      getDocs(usernameQuery),
      getDocs(nameQuery)
    ]);

    [usernameSnap, nameSnap].forEach(snapshot => {
      snapshot.forEach(d => {
        if(d.id !== me.uid){
          results.set(d.id, { uid: d.id, ...d.data() });
        }
      });
    });

    renderSearchResults([...results.values()]);

  }catch(error){
    console.error("SEARCH:", error);
    showToast(friendlyError(error));
  }
}

function renderSearchResults(users){
  const box = $("contactSearchResults");

  if(!users.length){
    box.innerHTML = `<div class="muted">Nenhum perfil encontrado.</div>`;
    return;
  }

  box.innerHTML =
    `<div style="margin-bottom:10px;font-weight:800;">Resultados da pesquisa</div>` +
    users.map(user => {
      const name = user.publicName || user.username || "Utilizador";

      return `
        <div class="card">
          <div class="person">
            <div class="avatar">
              ${escapeHTML(initials(name))}
              ${user.online ? `<span class="online-dot"></span>` : ""}
            </div>
            <div class="person-info">
              <div class="person-name">${escapeHTML(name)}</div>
              <div class="person-user">@${escapeHTML(user.username || "")}</div>
            </div>
            <button
              class="action add-contact"
              data-uid="${escapeHTML(user.uid)}"
              data-name="${escapeHTML(name)}"
              data-username="${escapeHTML(user.username || "")}"
            >
              Adicionar
            </button>
          </div>
        </div>
      `;
    }).join("");

  box.querySelectorAll(".add-contact").forEach(button => {
    button.onclick = () => {
      addContact({
        uid: button.dataset.uid,
        publicName: button.dataset.name,
        username: button.dataset.username
      });
    };
  });
}

function createPrivateChatId(uid1,uid2){
  return [uid1,uid2].sort().join("_");
}

async function openPrivateChat(otherUid){
  if(!me || !otherUid) return;

  try{
    const otherSnap = await getDoc(doc(db, "users", otherUid));

    if(!otherSnap.exists()){
      showToast("Este perfil já não existe.");
      return;
    }

    const other = { uid: otherUid, ...otherSnap.data() };
    const chatId = createPrivateChatId(me.uid, otherUid);
    const chatRef = doc(db, "chats", chatId);
    const existing = await getDoc(chatRef);

    if(!existing.exists()){
      await setDoc(chatRef, {
        id: chatId,
        type: "private",
        members: [me.uid, otherUid],
        memberNames: {
          [me.uid]: myProfile.publicName || myProfile.username || "Utilizador",
          [otherUid]: other.publicName || other.username || "Utilizador"
        },
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        lastMessage: "",
        lastSenderId: ""
      });
    }

    activeChat = {
      id: chatId,
      type: "private",
      otherUid,
      name: other.publicName || other.username || "Utilizador",
      avatar: initials(other.publicName || other.username || "U")
    };

    showChat();

  }catch(error){
    console.error("OPEN CHAT ERROR:", error);
    showToast(friendlyError(error));
  }
}

function showChat(){
  $("appScreen").classList.add("hidden");
  $("chatScreen").classList.remove("hidden");
  $("chatName").textContent = activeChat.name;
  $("chatAvatar").textContent = activeChat.avatar;
  $("chatStatus").textContent = activeChat.type === "group" ? "Grupo" : "Conversa";
  $("composer").classList.remove("hidden");
  $("messageInput").value = "";
  $("messageInput").focus();

  startChatMessages();
}

function startChatMessages(){
  if(activeChatUnsubscribe){
    activeChatUnsubscribe();
    activeChatUnsubscribe = null;
  }

  if(!activeChat) return;

  const messagesRef = collection(db, "chats", activeChat.id, "messages");
  const messagesQuery = query(
    messagesRef,
    orderBy("createdAt","asc"),
    limitToLast(100)
  );

  activeChatUnsubscribe = onSnapshot(
    messagesQuery,
    snapshot => {
      renderMessages(
        snapshot.docs.map(d => ({
          id: d.id,
          ...d.data()
        }))
      );
    },
    error => {
      console.error("MESSAGES:", error);
      showToast(friendlyError(error));
    }
  );
}

function renderMessages(messages){
  const box = $("messages");
  box.innerHTML = "";

  if(!messages.length){
    box.innerHTML = `<div class="muted">Esta conversa começou agora.</div>`;
    return;
  }

  messages.forEach(message => {
    const mine = message.senderId === me.uid;
    const time = message.createdAt?.toDate
      ? message.createdAt.toDate().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })
      : "...";

    const row = document.createElement("div");
    row.className = "message-row " + (mine ? "mine" : "");

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const text = document.createElement("div");
    text.className = "message-text";
    text.textContent = message.text || "";

    const meta = document.createElement("div");
    meta.className = "message-meta";

    let receipt = "";
    if(mine){
      const readBy = Array.isArray(message.readBy) ? message.readBy : [];
      receipt = readBy.includes(activeChat.otherUid) ? " ✓✓" : " ✓";
    }

    meta.textContent = time + receipt;

    bubble.appendChild(text);
    bubble.appendChild(meta);
    row.appendChild(bubble);
    box.appendChild(row);

    if(!mine && !(Array.isArray(message.readBy) && message.readBy.includes(me.uid))){
      updateDoc(
        doc(db, "chats", activeChat.id, "messages", message.id),
        { readBy: arrayUnion(me.uid) }
      ).catch(() => {});
    }
  });

  requestAnimationFrame(() => {
    box.scrollTop = box.scrollHeight;
  });
}

$("composer").addEventListener("submit", async event => {
  event.preventDefault();

  if(!activeChat || !me) return;

  const input = $("messageInput");
  const text = input.value.trim();

  if(!text) return;

  input.value = "";

  try{
    const chatRef = doc(db, "chats", activeChat.id);
    const messagesRef = collection(chatRef, "messages");

    await addDoc(messagesRef, {
      text,
      senderId: me.uid,
      senderName: myProfile.publicName || myProfile.username || "Utilizador",
      readBy: [me.uid],
      createdAt: serverTimestamp()
    });

    await updateDoc(chatRef, {
      lastMessage: text.slice(0,120),
      lastSenderId: me.uid,
      updatedAt: serverTimestamp()
    });

  }catch(error){
    console.error("SEND MESSAGE:", error);
    input.value = text;
    showToast(friendlyError(error));
  }
});

========================================================= */

function loadConversations(){
  if(!me) return;

  if(conversationsUnsubscribe){
    conversationsUnsubscribe();
  }

  const q = query(
    collection(db,"chats"),
    where("members", "array-contains", me.uid),
    limit(50)
  );

  conversationsUnsubscribe = onSnapshot(
    q,
    snapshot => {
      const chats = snapshot.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a,b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));

      renderConversations(chats);
    },
    error => {
      console.error("CONVERSATIONS:", error);
    }
  );
}

function renderConversations(chats){
  const box = $("conversationList");

  if(!chats.length){
    box.innerHTML = `<div class="muted">As tuas conversas aparecerão aqui.</div>`;
    return;
  }

  box.innerHTML = chats.map(chat => {
    let name = "Conversa";
    let avatar = "A";

    if(chat.type === "private"){
      const otherUid = (chat.members || []).find(uid => uid !== me.uid);
      name = chat.memberNames?.[otherUid] || "Utilizador";
      avatar = initials(name);
    }else{
      name = chat.name || "Grupo";
      avatar = initials(name);
    }

    const preview = chat.lastMessage || "Nova conversa";

    return `
      <div class="card">
        <div class="person" data-open-conversation="${escapeHTML(chat.id)}">
          <div class="avatar">${escapeHTML(avatar)}</div>
          <div class="person-info">
            <div class="person-name">${escapeHTML(name)}</div>
            <div class="person-user">${escapeHTML(preview)}</div>
          </div>
          <button class="action">Abrir</button>
        </div>
      </div>
    `;
  }).join("");

  box.querySelectorAll("[data-open-conversation]").forEach(row => {
    row.onclick = () => {
      const id = row.dataset.openConversation;
      const chat = chats.find(c => c.id === id);
      if(chat) openExistingChat(chat);
    };
  });
}

async function openExistingChat(chat){
  if(chat.type === "private"){
    const otherUid = (chat.members || []).find(uid => uid !== me.uid);

    if(!otherUid) return;

    const snap = await getDoc(doc(db, "users", otherUid));
    const other = snap.exists() ? snap.data() : {};

    activeChat = {
      id: chat.id,
      type: "private",
      otherUid,
      name: other.publicName || chat.memberNames?.[otherUid] || "Utilizador",
      avatar: initials(other.publicName || chat.memberNames?.[otherUid] || "U")
    };
  }else{
    activeChat = {
      id: chat.id,
      type: "group",
      name: chat.name || "Grupo",
      avatar: initials(chat.name || "Grupo")
    };
  }

  showChat();
}

function loadGroups(){
  if(!me) return;

  if(groupsUnsubscribe){
    groupsUnsubscribe();
  }

  const q = query(
    collection(db, "groups"),
    where("members", "array-contains", me.uid),
    limit(50)
  );

  groupsUnsubscribe = onSnapshot(
    q,
    snapshot => {
      const groups = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderGroups(groups);
    },
    error => {
      console.error("GROUPS:", error);
    }
  );
}

function renderGroups(groups){
  const box = $("groupsList");

  if(!groups.length){
    box.innerHTML = `<div class="muted">Ainda não participas de nenhum grupo.</div>`;
    return;
  }

  box.innerHTML = groups.map(group => {
    const name = group.name || "Grupo";

    return `
      <div class="card">
        <div class="person">
          <div class="avatar">${escapeHTML(initials(name))}</div>
          <div class="person-info">
            <div class="person-name">${escapeHTML(name)}</div>
            <div class="person-user">${(group.members || []).length} membros</div>
          </div>
          <button class="action" data-group="${escapeHTML(group.id)}">
            Abrir
          </button>
        </div>
      </div>
    `;
  }).join("");

  box.querySelectorAll("[data-group]").forEach(button => {
    button.onclick = () => {
      const group = groups.find(g => g.id === button.dataset.group);

      if(group){
        activeChat = {
          id: group.id,
          type: "group",
          name: group.name || "Grupo",
          avatar: initials(group.name || "Grupo")
        };
        showChat();
      }
    };
  });
}


/* =========================================================
   PERFIL / BOTÕES
========================================================= */

$("profileTopBtn").onclick = () => {
  showPage("profilePage");
};

$("profilePage").addEventListener("click", event => {
  if(event.target === $("profilePage")){
    showPage("conversationsPage");
  }
});


/* =========================================================
   LIMPEZA
========================================================= */

window.addEventListener("beforeunload", () => {
  if(contactsUnsubscribe) contactsUnsubscribe();
  if(conversationsUnsubscribe) conversationsUnsubscribe();
  if(groupsUnsubscribe) groupsUnsubscribe();
  if(activeChatUnsubscribe) activeChatUnsubscribe();
});

</script>
