<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0912">
<title>KidiTalk</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;background:#08070d;color:#f7f2ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}
button,input,textarea{font:inherit;}
button{border:0;cursor:pointer;}
.hidden{display:none!important;}
.screen{width:100%;height:100dvh;position:relative;}
.app{width:100%;height:100%;background:radial-gradient(circle at 90% 15%,rgba(174,72,255,.12),transparent 30%),radial-gradient(circle at 10% 85%,rgba(255,65,145,.08),transparent 35%),#08070d;}

/* AUTH */
.auth{width:min(620px,100%);height:100%;margin:auto;padding:26px 24px;display:flex;align-items:center;justify-content:center;overflow-y:auto;}
.auth-card{width:100%;max-width:560px;padding:28px;border:1px solid rgba(255,255,255,.10);border-radius:30px;background:rgba(17,14,26,.90);box-shadow:0 20px 70px rgba(0,0,0,.45);}
.logo{width:105px;height:105px;margin:0 auto 18px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;color:white;background:linear-gradient(135deg,#7d4cff,#ff3f91,#ff7b3d,#00d9ff);box-shadow:0 0 45px rgba(188,75,255,.35);}
.brand{text-align:center;font-size:38px;font-weight:900;letter-spacing:-1px;}
.subtitle{text-align:center;opacity:.58;line-height:1.6;margin:12px auto 25px;}
.tabs{display:flex;padding:5px;border-radius:18px;background:#17131f;margin-bottom:22px;}
.tab{flex:1;padding:14px;border-radius:14px;background:transparent;color:#aaa2b4;font-weight:700;}
.tab.active{color:white;background:linear-gradient(135deg,#7142d9,#c43691);}
.field{margin-bottom:15px;}
.field label{display:block;margin:0 0 7px 4px;font-size:13px;opacity:.65;}
.field input, .field textarea{width:100%;padding:14px 17px;border-radius:17px;border:1px solid rgba(255,255,255,.10);background:#17141e;color:white;outline:none;}
.field input:focus, .field textarea:focus{border-color:#a34cff;box-shadow:0 0 0 3px rgba(163,76,255,.12);}
.primary{width:100%;min-height:55px;border-radius:18px;color:white;font-weight:800;background:linear-gradient(135deg,#8148ff,#e63a99,#ff7541);}
.primary:disabled{opacity:.5;}

/* MAIN SYSTEM */
.main{width:100%;height:100%;display:flex;flex-direction:column;}
.topbar{flex:none;min-height:85px;padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(9,8,14,.88);backdrop-filter:blur(18px);}
.identity{display:flex;align-items:center;gap:13px;min-width:0;}
.avatar{width:52px;height:52px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:white;background:linear-gradient(135deg,#8745ff,#ff3d91);position:relative;background-size:cover;background-position:center;}
.identity-text{min-width:0;}
.identity-name{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.identity-user{opacity:.5;font-size:13px;}
.top-actions{display:flex;gap:10px;}
.icon-btn{width:48px;height:48px;border-radius:16px;color:white;background:#17141f;border:1px solid rgba(255,255,255,.08);font-size:20px;}

.content{flex:1;min-height:0;overflow:hidden;position:relative;}
.page{width:100%;height:100%;overflow-y:auto;padding:20px 20px 105px;}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.back-btn{padding:8px 14px;border-radius:12px;background:#1d1829;color:#a34cff;font-weight:700;font-size:14px;}
.page-title{font-size:24px;font-weight:900;margin:0;}
.search{width:100%;height:50px;border-radius:17px;border:1px solid rgba(255,255,255,.08);background:#14111c;color:white;padding:0 17px;outline:none;margin-bottom:18px;}
.card{padding:15px;border-radius:22px;background:#15121d;border:1px solid rgba(255,255,255,.07);margin-bottom:12px;}

/* CONVERSATIONS SWIPE */
.swipe-container{position:relative;overflow:hidden;border-radius:22px;margin-bottom:12px;background:#e63a3a;}
.swipe-item{display:flex;align-items:center;gap:12px;padding:15px;background:#15121d;border:1px solid rgba(255,255,255,.07);border-radius:22px;transition:transform 0.2s ease;cursor:pointer;position:relative;z-index:2;}
.swipe-action{position:absolute;right:0;top:0;bottom:0;width:90px;background:#e63a3a;color:white;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:1;border-radius:0 22px 22px 0;}

.person-info{flex:1;min-width:0;}
.person-name{font-weight:800;font-size:16px;}
.person-user{opacity:.5;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.action{flex:none;padding:10px 16px;border-radius:14px;color:white;font-weight:800;background:linear-gradient(135deg,#7545e8,#db419c);font-size:13px;}
.muted{opacity:.45;text-align:center;padding:30px 10px;}

/* CHAT INTERFACE */
.chat{width:100%;height:100%;display:flex;flex-direction:column;background:#09080f;}
.chat-header{min-height:70px;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07);background:#0d0b14;}
.back{width:42px;height:42px;border-radius:14px;color:white;background:#181520;font-size:21px;}
.chat-title{flex:1;min-width:0;}
.chat-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.messages{flex:1;min-height:0;overflow-y:auto;padding:16px 14px;}
.message-row{display:flex;margin:7px 0;position:relative;}
.message-row.mine{justify-content:flex-end;}
.bubble{max-width:78%;padding:10px 13px 7px;border-radius:19px;background:#1b1824;border:1px solid rgba(255,255,255,.05);user-select:none;}
.mine .bubble{background:linear-gradient(135deg,#693dcc,#b33791);}
.message-text{white-space:pre-wrap;overflow-wrap:anywhere;}
.message-meta{text-align:right;font-size:10px;opacity:.65;margin-top:4px;display:flex;align-items:center;justify-content:flex-end;gap:4px;}
.blue-tick{color:#00d9ff;font-weight:bold;}

.composer{flex:none;display:flex;gap:8px;padding:9px 10px max(9px,env(safe-area-inset-bottom));background:#0d0b14;border-top:1px solid rgba(255,255,255,.06);}
.composer input{flex:1;min-width:0;height:50px;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:0 16px;background:#191620;color:white;outline:none;}
.send{width:52px;height:50px;border-radius:17px;color:white;background:linear-gradient(135deg,#7947f1,#ec429c);font-size:20px;}

.bottom{position:absolute;z-index:20;left:18px;right:18px;bottom:max(12px,env(safe-area-inset-bottom));height:68px;display:flex;align-items:center;justify-content:space-around;border-radius:25px;background:rgba(24,20,32,.94);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 35px rgba(0,0,0,.35);backdrop-filter:blur(18px);}
.nav{flex:1;height:100%;color:#85808e;background:transparent;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.nav-icon{font-size:19px;}
.nav.active{color:white;}

/* MODAL, PREVIEW & FULLSCREEN STATUS */
.modal{position:fixed;z-index:100;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.68);backdrop-filter:blur(6px);}
.modal-card{width:min(600px,100%);max-height:88dvh;overflow-y:auto;padding:22px;border-radius:30px 30px 0 0;background:#15121d;border:1px solid rgba(255,255,255,.09);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-title{font-size:20px;font-weight:900;}
.close{width:40px;height:40px;border-radius:14px;color:white;background:#211d29;}

.preview-box{width:100%;max-height:220px;border-radius:16px;overflow:hidden;background:#000;margin-top:10px;display:flex;align-items:center;justify-content:center;}
.preview-box img, .preview-box video{max-width:100%;max-height:220px;object-fit:contain;}

.status-viewer{position:fixed;z-index:250;inset:0;background:#000;display:flex;flex-direction:column;justify-content:space-between;padding:15px;}
.status-progress-bar{width:100%;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;margin-bottom:10px;}
.status-progress-fill{height:100%;width:0%;background:#fff;transition:width 0.1s linear;}
.status-media-container{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.status-media-container img, .status-media-container video{max-width:100%;max-height:100%;object-fit:contain;}

.toast{position:fixed;z-index:300;left:50%;bottom:92px;transform:translateX(-50%);max-width:90%;padding:12px 18px;border-radius:16px;background:#25202e;color:white;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 35px rgba(0,0,0,.5);text-align:center;font-size:13px;font-weight:600;}
.file-label{display:inline-block;padding:12px 18px;border-radius:14px;background:#211d2b;color:#a34cff;border:1px dashed #a34cff;cursor:pointer;font-weight:700;text-align:center;width:100%;margin-top:6px;}
</style>
</head>

<body>

<div id="authScreen" class="screen">
  <div class="auth">
    <div class="auth-card">
      <div class="logo">K</div>
      <div class="brand">KidiTalk</div>
      <div class="subtitle">Conecta-te com o mundo de forma simples, privada e rápida.</div>

      <div class="tabs">
        <button id="loginTab" class="tab active">Entrar</button>
        <button id="registerTab" class="tab">Criar conta</button>
      </div>

      <div id="registerFields" class="hidden">
        <div class="field">
          <label>Nome público</label>
          <input id="regName" placeholder="Ex.: Gaspar Kididi">
        </div>
        <div class="field">
          <label>Nome de utilizador</label>
          <input id="regUsername" placeholder="Ex.: gaspar_kididi">
        </div>
      </div>

      <div class="field">
        <label>E-mail</label>
        <input id="authEmail" type="email" placeholder="teu@email.com">
      </div>
      <div class="field">
        <label>Senha</label>
        <input id="authPassword" type="password" placeholder="Mínimo 6 caracteres">
      </div>

      <button id="authButton" class="primary">Entrar no KidiTalk</button>
    </div>
  </div>
</div>

<div id="appScreen" class="screen hidden">
  <div class="app">
    <div class="main">
      <header class="topbar">
        <div class="identity">
          <div id="topAvatar" class="avatar">K</div>
          <div class="identity-text">
            <div id="topName" class="identity-name">KidiTalk</div>
            <div id="topUsername" class="identity-user">@utilizador</div>
          </div>
        </div>
        <div class="top-actions">
          <button id="settingsTopBtn" class="icon-btn">⚙</button>
        </div>
      </header>

      <main class="content">
        <section id="conversationsPage" class="page">
          <div class="page-title" style="margin-bottom:18px;">Conversas</div>
          <div id="conversationList"></div>
        </section>

        <section id="contactsPage" class="page hidden">
          <div class="page-title" style="margin-bottom:18px;">Contactos</div>
          <input id="contactSearch" class="search" placeholder="Pesquisar por @username...">
          <div id="contactSearchResults"></div>
          
          <div style="margin:15px 0 10px;font-weight:800;">Pedidos Pendentes</div>
          <div id="requestsList"></div>

          <div style="margin:20px 0 10px;font-weight:800;">Os Meus Contactos</div>
          <div id="contactsList"></div>
        </section>

        <section id="statusPage" class="page hidden">
          <div class="page-title" style="margin-bottom:18px;">Status</div>
          <button id="addStatusBtn" class="primary" style="margin-bottom:18px;">+ Publicar Novo Status</button>
          <div id="statusList"></div>
        </section>

        <section id="settingsPage" class="page hidden">
          <div class="page-title" style="margin-bottom:18px;">Definições</div>
          <div class="card" id="openProfileBtn" style="cursor:pointer;display:flex;align-items:center;gap:15px;">
            <div id="settingsAvatar" class="avatar" style="width:60px;height:60px;font-size:24px;">K</div>
            <div>
              <div id="settingsName" style="font-weight:800;font-size:18px;">Utilizador</div>
              <div id="settingsUser" style="opacity:.5;font-size:13px;">@utilizador</div>
              <div style="color:#a34cff;font-size:12px;margin-top:4px;">Editar Perfil ›</div>
            </div>
          </div>
          <button id="logoutBtn" class="primary" style="margin-top:20px;background:#e63a3a;">Terminar Sessão</button>
        </section>

        <section id="profileEditPage" class="page hidden">
          <div class="page-header">
            <button class="back-btn" onclick="showPage('settingsPage')">← Voltar</button>
            <h2 class="page-title">Editar Perfil</h2>
          </div>
          <div class="card">
            <div class="field">
              <label>Nome Público</label>
              <input id="profileNameInput">
            </div>
            <div class="field">
              <label>Escolher Foto da Galeria</label>
              <label class="file-label">
                📷 Selecionar Imagem
                <input type="file" id="profileFilePicker" accept="image/*" class="hidden">
              </label>
            </div>
            <button id="saveProfileBtn" class="primary" style="margin-top:10px;">Guardar Alterações</button>
          </div>
        </section>
      </main>

      <nav class="bottom">
        <button class="nav active" data-page="conversationsPage">
          <span class="nav-icon">◉</span> Conversas
        </button>
        <button class="nav" data-page="contactsPage">
          <span class="nav-icon">♣</span> Contactos
        </button>
        <button class="nav" data-page="statusPage">
          <span class="nav-icon">✦</span> Status
        </button>
        <button class="nav" data-page="settingsPage">
          <span class="nav-icon">⚙</span> Definições
        </button>
      </nav>
    </div>
  </div>
</div>

<div id="chatScreen" class="screen hidden">
  <div class="chat">
    <header class="chat-header">
      <button id="closeChatBtn" class="back">‹</button>
      <div id="chatAvatar" class="avatar">K</div>
      <div class="chat-title">
        <div id="chatName" class="chat-name">Conversa</div>
      </div>
    </header>

    <div id="messages" class="messages"></div>

    <form id="composer" class="composer">
      <input id="messageInput" autocomplete="off" placeholder="Escreve uma mensagem...">
      <button class="send" type="submit">➤</button>
    </form>
  </div>
</div>

<div id="statusModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">Novo Status</div>
      <button id="closeStatusModal" class="close">×</button>
    </div>
    <div class="field">
      <label>Escolher Mídia da Galeria</label>
      <label class="file-label">
        📁 Carregar Foto / Vídeo
        <input type="file" id="statusFilePicker" accept="image/*,video/*" class="hidden">
      </label>
      <div id="statusPreviewContainer" class="preview-box hidden"></div>
    </div>
    <div class="field">
      <label>Legenda</label>
      <textarea id="statusCaption" rows="2" placeholder="Escreve uma legenda..."></textarea>
    </div>
    <button id="confirmPublishStatus" class="primary">Publicar Status</button>
  </div>
</div>

<div id="statusViewer" class="status-viewer hidden">
  <div>
    <div class="status-progress-bar">
      <div id="statusProgressFill" class="status-progress-fill"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div id="statusViewerName" style="font-weight:800;color:white;">---</div>
      <button onclick="closeStatusViewer()" style="background:transparent;color:white;font-size:20px;">×</button>
    </div>
  </div>
  <div id="statusViewerContent" class="status-media-container"></div>
  <div id="statusViewerCaption" style="text-align:center;color:white;padding:10px;font-size:14px;"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, deleteDoc, collection, query, where, orderBy, limitToLast, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBl_SqID26LfAIYrd9HykCETmNLb7d66m4",
  authDomain: "angotell.firebaseapp.com",
  projectId: "angotell",
  storageBucket: "angotell.firebasestorage.app",
  messagingSenderId: "241567716431",
  appId: "1:241567716431:web:ffd859078a6198bc17463a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let me = null;
let myProfile = null;
let activeChat = null;
let activeChatUnsubscribe = null;
let uploadedProfileBase64 = "";
let uploadedStatusBase64 = "";
let uploadedStatusType = "image";
let statusTimer = null;

const $ = id => document.getElementById(id);

function escapeHTML(str){
  return String(str ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

function initials(name){
  const parts = String(name || "K").trim().split(/\s+/).filter(Boolean);
  return parts.length === 1 ? parts[0].slice(0,2).toUpperCase() : (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

function getChatId(uid1, uid2) {
  return [uid1, uid2].sort().join("_");
}

function showToast(msg){
  $("toast").textContent = msg;
  $("toast").classList.remove("hidden");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => $("toast").classList.add("hidden"), 3000);
}

window.showPage = (pageId) => {
  document.querySelectorAll(".page").forEach(p => p.classList.add("hidden"));
  $(pageId).classList.remove("hidden");
  document.querySelectorAll(".nav").forEach(b => b.classList.toggle("active", b.dataset.page === pageId));
};

document.querySelectorAll(".nav[data-page]").forEach(b => {
  b.onclick = () => {
    showPage(b.dataset.page);
    if(b.dataset.page === "contactsPage") { loadContacts(); loadRequests(); }
    if(b.dataset.page === "statusPage") loadStatuses();
  };
});

function resizeImageFile(file, maxWidth = 400, maxHeight = 400) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let width = img.width, height = img.height;
        if (width > height) {
          if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
        } else {
          if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
        }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

$("profileFilePicker").onchange = async (e) => {
  const file = e.target.files[0];
  if(file){ uploadedProfileBase64 = await resizeImageFile(file, 400, 400); showToast("Foto ajustada!"); }
};

$("statusFilePicker").onchange = async (e) => {
  const file = e.target.files[0];
  const box = $("statusPreviewContainer");
  if(file){
    if(file.type.startsWith("image")){
      uploadedStatusBase64 = await resizeImageFile(file, 800, 800);
      uploadedStatusType = "image";
      box.innerHTML = `<img src="${uploadedStatusBase64}">`;
    } else {
      const reader = new FileReader();
      reader.onload = () => {
        uploadedStatusBase64 = reader.result;
        uploadedStatusType = "video";
        box.innerHTML = `<video src="${uploadedStatusBase64}" controls></video>`;
      };
      reader.readAsDataURL(file);
    }
    box.classList.remove("hidden");
  }
};

let authMode = "login";
$("loginTab").onclick = () => { authMode = "login"; $("loginTab").classList.add("active"); $("registerTab").classList.remove("active"); $("registerFields").classList.add("hidden"); };
$("registerTab").onclick = () => { authMode = "register"; $("registerTab").classList.add("active"); $("loginTab").classList.remove("active"); $("registerFields").classList.remove("hidden"); };

$("authButton").onclick = async () => {
  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;
  if(!email || !password) return showToast("Preenche todos os campos.");
  $("authButton").disabled = true;
  try {
    if(authMode === "login"){
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const publicName = $("regName").value.trim();
      const username = $("regUsername").value.trim().toLowerCase().replace(/[^a-z0-9_.]/g,"");
      if(!publicName || username.length < 3) { $("authButton").disabled = false; return showToast("Dados de registo inválidos."); }
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", cred.user.uid), { uid: cred.user.uid, publicName, username, email, createdAt: serverTimestamp() });
      await setDoc(doc(db, "usernames", username), { uid: cred.user.uid });
    }
  } catch(e) { showToast("Erro: " + e.message); $("authButton").disabled = false; }
};

onAuthStateChanged(auth, async user => {
  if(!user){ $("authScreen").classList.remove("hidden"); $("appScreen").classList.add("hidden"); return; }
  me = user;
  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  await loadMyProfile();
  loadConversations();
});

async function loadMyProfile(){
  const snap = await getDoc(doc(db, "users", me.uid));
  myProfile = snap.data() || {};
  renderProfile();
}

function renderProfile(){
  const name = myProfile.publicName || "Utilizador";
  const user = "@" + (myProfile.username || "utilizador");
  $("topName").textContent = name;
  $("topUsername").textContent = user;
  $("settingsName").textContent = name;
  $("settingsUser").textContent = user;
  if(myProfile.photoUrl) {
    $("topAvatar").style.backgroundImage = `url('${myProfile.photoUrl}')`;
    $("topAvatar").textContent = "";
    $("settingsAvatar").style.backgroundImage = `url('${myProfile.photoUrl}')`;
    $("settingsAvatar").textContent = "";
  } else {
    $("topAvatar").style.backgroundImage = "none";
    $("topAvatar").textContent = initials(name);
    $("settingsAvatar").style.backgroundImage = "none";
    $("settingsAvatar").textContent = initials(name);
  }
}

$("settingsTopBtn").onclick = () => showPage("settingsPage");
$("openProfileBtn").onclick = () => { $("profileNameInput").value = myProfile.publicName || ""; showPage("profileEditPage"); };

$("saveProfileBtn").onclick = async () => {
  const publicName = $("profileNameInput").value.trim();
  if(!publicName) return showToast("Insere um nome.");
  $("saveProfileBtn").disabled = true;
  const updateData = { publicName };
  if(uploadedProfileBase64) { updateData.photoUrl = uploadedProfileBase64; myProfile.photoUrl = uploadedProfileBase64; }
  await updateDoc(doc(db, "users", me.uid), updateData);
  myProfile.publicName = publicName;
  renderProfile();
  showToast("Perfil atualizado!");
  showPage("settingsPage");
  $("saveProfileBtn").disabled = false;
};

$("logoutBtn").onclick = () => signOut(auth);

$("contactSearch").oninput = async (e) => {
  const term = e.target.value.trim().toLowerCase().replace("@","");
  if(term.length < 3) return;
  const box = $("contactSearchResults");
  box.innerHTML = `<div class="muted">A pesquisar...</div>`;
  const q = query(collection(db, "users"), where("username", "==", term));
  const snap = await getDocs(q);
  if(snap.empty) { box.innerHTML = `<div class="muted">Sem resultados.</div>`; return; }
  box.innerHTML = snap.docs.map(d => {
    const u = d.data();
    if(u.uid === me.uid) return "";
    return `
      <div class="card person">
        <div class="avatar">${initials(u.publicName)}</div>
        <div class="person-info">
          <div class="person-name">${escapeHTML(u.publicName)}</div>
          <div class="person-user">@${escapeHTML(u.username)}</div>
        </div>
        <button class="action" onclick="sendFriendRequest('${u.uid}')">Adicionar</button>
      </div>`;
  }).join("");
};

window.sendFriendRequest = async (targetUid) => {
  await setDoc(doc(db, "users", targetUid, "requests", me.uid), {
    fromUid: me.uid, fromName: myProfile.publicName, fromUsername: myProfile.username, createdAt: serverTimestamp()
  });
  showToast("Pedido enviado!");
};

function loadRequests(){
  onSnapshot(collection(db, "users", me.uid, "requests"), snap => {
    const box = $("requestsList");
    if(snap.empty){ box.innerHTML = `<div class="muted">Sem pedidos pendentes.</div>`; return; }
    box.innerHTML = snap.docs.map(d => {
      const r = d.data();
      return `
        <div class="card person">
          <div class="person-info">
            <div class="person-name">${escapeHTML(r.fromName)}</div>
            <div class="person-user">@${escapeHTML(r.fromUsername)}</div>
          </div>
          <button class="action" onclick="acceptRequest('${r.fromUid}', '${escapeHTML(r.fromName)}', '${escapeHTML(r.fromUsername)}')">Aceitar</button>
        </div>`;
    }).join("");
  });
}

window.acceptRequest = async (fromUid, name, username) => {
  try {
    await setDoc(doc(db, "users", me.uid, "contacts", fromUid), { uid: fromUid, publicName: name, username });
    await setDoc(doc(db, "users", fromUid, "contacts", me.uid), { uid: me.uid, publicName: myProfile.publicName, username: myProfile.username });
    await deleteDoc(doc(db, "users", me.uid, "requests", fromUid));
    
    showToast("Pedido aceite!");
    openChat(fromUid, name);
  } catch(e) {
    showToast("Erro ao aceitar pedido.");
  }
};

function loadContacts(){
  onSnapshot(collection(db, "users", me.uid, "contacts"), snap => {
    const box = $("contactsList");
    if(snap.empty){ box.innerHTML = `<div class="muted">Sem contactos.</div>`; return; }
    box.innerHTML = snap.docs.map(d => {
      const c = d.data();
      return `
        <div class="card person">
          <div class="avatar">${initials(c.publicName)}</div>
          <div class="person-info">
            <div class="person-name">${escapeHTML(c.publicName)}</div>
            <div class="person-user">@${escapeHTML(c.username)}</div>
          </div>
          <button class="action" onclick="openChat('${c.uid}', '${escapeHTML(c.publicName)}')">Conversar</button>
        </div>`;
    }).join("");
  });
}

function loadConversations(){
  const q = query(collection(db, "chats"), where("members", "array-contains", me.uid));
  onSnapshot(q, async snap => {
    const box = $("conversationList");
    if(snap.empty){ box.innerHTML = `<div class="muted">Sem conversas.</div>`; return; }
    let html = "";
    for(const d of snap.docs){
      const c = d.data();
      const otherUid = c.members.find(m => m !== me.uid);
      let displayName = "Conversa";
      if(otherUid){
        const userSnap = await getDoc(doc(db, "users", otherUid));
        if(userSnap.exists()) displayName = userSnap.data().publicName || userSnap.data().username;
      }
      html += `
        <div class="swipe-container">
          <div class="swipe-action" onclick="deleteChat('${d.id}')">Eliminar</div>
          <div class="swipe-item" onclick="openChat('${otherUid}', '${escapeHTML(displayName)}')">
            <div class="avatar">${initials(displayName)}</div>
            <div class="person-info">
              <div class="person-name">${escapeHTML(displayName)}</div>
              <div class="person-user">${escapeHTML(c.lastMessage || "Sem mensagens...")}</div>
            </div>
          </div>
        </div>`;
    }
    box.innerHTML = html;
  });
}

window.deleteChat = async (chatId) => {
  if(confirm("Eliminar conversa?")) {
    await deleteDoc(doc(db, "chats", chatId));
    showToast("Conversa eliminada.");
  }
};

window.openChat = async (otherUid, otherName) => {
  const chatId = getChatId(me.uid, otherUid);
  const chatRef = doc(db, "chats", chatId);
  const snap = await getDoc(chatRef);

  if(!snap.exists()){
    await setDoc(chatRef, { id: chatId, members: [me.uid, otherUid], updatedAt: serverTimestamp() });
  }

  activeChat = { id: chatId, name: otherName, otherUid };
  $("chatName").textContent = otherName;
  $("chatAvatar").textContent = initials(otherName);
  $("appScreen").classList.add("hidden");
  $("chatScreen").classList.remove("hidden");

  listenMessages();
};

function listenMessages(){
  if(activeChatUnsubscribe) activeChatUnsubscribe();
  const q = query(collection(db, "chats", activeChat.id, "messages"), orderBy("createdAt", "asc"), limitToLast(100));
  activeChatUnsubscribe = onSnapshot(q, snap => {
    const box = $("messages");
    box.innerHTML = snap.docs.map(d => {
      const m = d.data();
      const mine = m.senderId === me.uid;
      return `
        <div class="message-row ${mine ? 'mine' : ''}">
          <div class="bubble">
            <div class="message-text">${escapeHTML(m.text)}</div>
          </div>
        </div>`;
    }).join("");
    box.scrollTop = box.scrollHeight;
  });
}

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const input = $("messageInput");
  const text = input.value.trim();
  if(!text || !activeChat) return;
  input.value = "";
  
  await addDoc(collection(db, "chats", activeChat.id, "messages"), {
    text, senderId: me.uid, createdAt: serverTimestamp()
  });
  await updateDoc(doc(db, "chats", activeChat.id), { lastMessage: text, updatedAt: serverTimestamp() });
};

$("closeChatBtn").onclick = () => {
  $("chatScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  if(activeChatUnsubscribe) activeChatUnsubscribe();
};

/* STATUS VIEWER FULLSCREEN */
$("addStatusBtn").onclick = () => $("statusModal").classList.remove("hidden");
$("closeStatusModal").onclick = () => $("statusModal").classList.add("hidden");

$("confirmPublishStatus").onclick = async () => {
  if(!uploadedStatusBase64) return showToast("Escolha um ficheiro.");
  await addDoc(collection(db, "statuses"), {
    uid: me.uid, name: myProfile.publicName, mediaData: uploadedStatusBase64, mediaType: uploadedStatusType, caption: $("statusCaption").value.trim(), createdAt: serverTimestamp()
  });
  $("statusModal").classList.add("hidden");
  uploadedStatusBase64 = "";
  $("statusCaption").value = "";
  $("statusPreviewContainer").classList.add("hidden");
  showToast("Status publicado!");
  loadStatuses();
};

function loadStatuses(){
  onSnapshot(collection(db, "statuses"), snap => {
    const box = $("statusList");
    if(snap.empty){ box.innerHTML = `<div class="muted">Nenhum status.</div>`; return; }
    box.innerHTML = snap.docs.map(d => {
      const s = d.data();
      return `
        <div class="card" style="cursor:pointer;" onclick="viewStatus('${escapeHTML(s.name)}', '${s.mediaData}', '${s.mediaType}', '${escapeHTML(s.caption)}')">
          <div style="font-weight:800;">${escapeHTML(s.name)}</div>
          <div style="font-size:12px;opacity:.6;">Clique para visualizar em ecrã inteiro</div>
        </div>`;
    }).join("");
  });
}

window.viewStatus = (name, mediaData, mediaType, caption) => {
  $("statusViewerName").textContent = name;
  $("statusViewerCaption").textContent = caption;
  const box = $("statusViewerContent");
  
  if(mediaType === "video"){
    box.innerHTML = `<video id="statusVideo" src="${mediaData}" autoplay></video>`;
  } else {
    box.innerHTML = `<img src="${mediaData}">`;
  }

  $("statusViewer").classList.remove("hidden");
  
  let fill = $("statusProgressFill");
  fill.style.width = "0%";
  let duration = 5000;
  let elapsed = 0;

  clearInterval(statusTimer);
  statusTimer = setInterval(() => {
    elapsed += 100;
    fill.style.width = (elapsed / duration * 100) + "%";
    if(elapsed >= duration){
      closeStatusViewer();
    }
  }, 100);
};

window.closeStatusViewer = () => {
  clearInterval(statusTimer);
  $("statusViewer").classList.add("hidden");
};
</script>
</body>
</html>
